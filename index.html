<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keto-Protokoll</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1D3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style id="pagestyle">@page{size:A4 portrait;margin:12mm}</style>
<style>
:root{--paper:#FAFCFE;--grid:#E6EDF5;--ink:#1D3A6B;--text:#22272E;--muted:#667281;--line:#C9D4E0;--field:#FFFFFF;--keto:#0F7F73;--ketoBand:rgba(15,127,115,.13);--s2:#B4541F;--warn:#B42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161D;--grid:#19212B;--ink:#9CB9EA;--text:#E3E8EF;--muted:#8E99A8;--line:#2C3744;--field:#161D26;--keto:#4FC7B6;--ketoBand:rgba(79,199,182,.15);--s2:#E89A63;--warn:#F07A6E}}
:root[data-theme="dark"]{--paper:#11161D;--grid:#19212B;--ink:#9CB9EA;--text:#E3E8EF;--muted:#8E99A8;--line:#2C3744;--field:#161D26;--keto:#4FC7B6;--ketoBand:rgba(79,199,182,.15);--s2:#E89A63;--warn:#F07A6E}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--text);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header h1{font-weight:600;font-size:1.7rem;line-height:1.2;color:var(--ink);margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.nudge{font-size:.85rem;color:var(--s2);margin:4px 0 0}
.nudge button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin:12px 0 16px}
.strip button{aspect-ratio:1;border:1px solid var(--line);background:var(--field);border-radius:2px;padding:0;cursor:pointer;min-width:0}
.strip .part{background:var(--ketoBand);border-color:var(--keto)}
.strip .done{background:var(--keto);border-color:var(--keto)}
.strip .today{outline:2px solid var(--ink);outline-offset:1px}
.strip .cur{border:2px solid var(--s2)}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--ink);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
nav button{border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panel{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.panel h2{font-size:1.05rem;font-weight:600;color:var(--ink);margin:0 0 4px}
.row{display:grid;grid-template-columns:1fr 170px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.wide{grid-template-columns:1fr}
.row label b{display:block;font-weight:500}
.row label small,.row .lbl small{color:var(--muted);font-size:.82rem}
.row .lbl b{display:block;font-weight:500}
.inp{display:flex;align-items:center;gap:6px}
input,textarea,select{font:inherit;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.unit{color:var(--muted);font-size:.82rem;min-width:3.6em}
.hint{grid-column:1/-1;color:var(--s2);font-size:.78rem;margin-top:2px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scale,.seg{display:flex;gap:4px}
.scale button,.seg button,.chips button,.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;font:inherit;color:var(--text);cursor:pointer;padding:8px 10px}
.scale button,.seg button{flex:1;padding:8px 0}
.scale button.on,.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border-radius:999px;padding:5px 12px;font-size:.9rem}
.chips button.on{background:var(--s2);border-color:var(--s2);color:#fff}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.datebar input{flex:1}
.datebar .btn{min-width:44px;font-size:1.2rem;padding:6px 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:500;color:var(--muted)}
td.num,th.num{text-align:right}
.labtbl input{padding:5px 6px}
.labtbl td{padding:4px}
.up{color:var(--s2)}.down{color:var(--keto)}
.oor{color:var(--warn)}
.chart{margin:0 0 18px}
.chart figcaption{font-weight:500;margin-bottom:2px}
.chart svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.s1,.s2,.s3{fill:none;stroke-width:2;stroke-linejoin:round}
.s1{stroke:var(--ink)}.s1d{fill:var(--ink)}
.s2{stroke:var(--s2)}.s2d{fill:var(--s2)}
.s3{stroke:var(--keto)}.s3d{fill:var(--keto)}
.band{fill:var(--ketoBand)}
.goal{stroke:var(--warn);stroke-dasharray:5 4;stroke-width:1.3}
.key{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 10px}
#status{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:4px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#status.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:540px){.row{grid-template-columns:1fr 140px}.strip{grid-template-columns:repeat(15,1fr)}header h1{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#print{display:none}

/* ---------- print ---------- */
@media print{
 :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--paper:#fff;--grid:#fff;--ink:#1D3A6B;--text:#000;--muted:#555;--line:#bbb;--field:#fff;--keto:#0F7F73;--ketoBand:rgba(15,127,115,.13);--s2:#B4541F;--warn:#B42318}
 :root{padding:0}
 body{background:#fff;color:#000;font-size:10.5pt}
 body>*:not(#print){display:none!important}
 #print{display:block}
}
.sheet h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:17pt;font-weight:600;margin:0;color:#fff}
.sheet .sh{background:#1D3A6B;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;padding:3mm 4mm;margin:0 0 3mm;border-radius:1mm}
.sheet .sh-app{display:block;font-size:7.5pt;letter-spacing:.6mm;text-transform:uppercase;color:rgba(255,255,255,.72);margin:0 0 .8mm}
.sheet .sh-date{font-size:8.5pt;font-weight:400;color:rgba(255,255,255,.88)}
.sheet table{table-layout:fixed;width:100%;border-collapse:collapse}
.sheet th,.sheet td{border-right:.6pt solid #666;padding:1mm 2mm;color:#000}
.sheet th:last-child,.sheet td:last-child{border-right:0}
.sheet tbody tr td,.sheet tbody tr th{border-bottom:.25pt solid #ccc}
.sheet tbody tr:last-child td,.sheet tbody tr:last-child th{border-bottom:.6pt solid #666}
.sheet thead th{border-bottom:.6pt solid #666;text-align:center;font-weight:600;font-size:10pt;height:9mm}
.sheet tbody th{width:40mm;text-align:left;font-weight:600;font-size:10pt}
.sheet th small{display:block;font-weight:400;color:#555;font-size:7.5pt}
.sheet tbody td{text-align:center;font-size:12pt}
.sheet tbody.blk-daily td,.sheet tbody.blk-daily th{background:var(--ketoBand);height:13mm}
.sheet tbody.blk-befinden td,.sheet tbody.blk-befinden th{height:9mm}
.sheet .opts{color:#999;font-size:9pt;letter-spacing:1.6mm}
.sheet tr.tall td{height:17mm}
.sheet .wk-wrap{border-top:.8pt solid #1D3A6B;margin-top:4mm;padding-top:2mm}
.sheet .wk-label{font-family:"IBM Plex Serif",Georgia,serif;font-size:9pt;font-weight:600;color:#1D3A6B;margin:0 0 1.5mm}
.sheet .wk{display:grid;grid-template-columns:repeat(5,1fr) 2.2fr;gap:2.5mm}
.sheet .wk div{border:.6pt solid #666;padding:1.2mm 2mm;min-height:15mm;font-size:8.5pt;color:#333}
.sheet .wk b{display:block;font-size:11pt;color:#000;margin-top:1mm}
.sheet .foot{font-size:7.5pt;color:#555;margin-top:2mm}
.report-title{padding-bottom:2mm;margin-bottom:4mm;border-bottom:.8pt solid #1D3A6B}
.report-title .overline{font-size:7.5pt;letter-spacing:.6mm;text-transform:uppercase;color:#1D3A6B;margin:0 0 1mm}
.report-title .subtitle{font-size:9pt;color:#444;margin:0}
.report h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:22pt;font-weight:600;color:#1D3A6B;margin:0 0 1.5mm}
.report h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:12pt;font-weight:600;color:#1D3A6B;border-bottom:.8pt solid #1D3A6B;padding-bottom:.8mm;margin:5mm 0 1.5mm;break-after:avoid}
.report table{font-size:9.5pt}
.report th,.report td{padding:1.2mm 2mm;border-bottom:.3pt solid #ddd;color:#000}
.report thead th{border-bottom:.8pt solid #1D3A6B}
.report .cg{display:grid;grid-template-columns:1fr 1fr;gap:5mm 6mm;align-items:start}
.report .chart{break-inside:avoid;margin:0}
.report .chart figcaption{margin-bottom:1mm;line-height:1.2}
.report .chart .sub{margin:.5mm 0 0;font-size:7.5pt;line-height:1.2}
.report .chart text{font-size:13px}
.report p{margin:1mm 0}
.report ul{margin:1mm 0;padding-left:4mm}
.report li{margin:.5mm 0}
.report .small{font-size:8.5pt;color:#444}
.report .qs{white-space:pre-wrap;border:.6pt solid #999;padding:2mm 3mm;min-height:30mm}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Keto-Protokoll</h1>
  <p class="sub" id="hsub"></p>
  <p class="sub" id="verline" style="font-size:.75rem"></p>
  <p class="nudge" id="nudge" hidden></p>
 </header>
 <div class="strip" id="strip" aria-label="Übersicht aller Tage"></div>
 <nav role="tablist">
  <button role="tab" data-tab="day" aria-selected="true">Heute</button>
  <button role="tab" data-tab="week" aria-selected="false">Woche</button>
  <button role="tab" data-tab="lab" aria-selected="false">Labor</button>
  <button role="tab" data-tab="trend" aria-selected="false">Verlauf</button>
  <button role="tab" data-tab="print" aria-selected="false">Drucken</button>
  <button role="tab" data-tab="set" aria-selected="false">Einstellungen</button>
 </nav>
 <main>
  <section id="v-day"></section>
  <section id="v-week" hidden></section>
  <section id="v-lab" hidden></section>
  <section id="v-trend" hidden></section>
  <section id="v-print" hidden></section>
  <section id="v-set" hidden></section>
 </main>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div id="print"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const KEY='ketoProtokoll_v1';
const VERSION='1.1.0'; // keep sw.js's CACHE_NAME suffix in sync with this by hand
const SYMS=['Kopfschmerz','Müdigkeit','Muskelkrämpfe','Verdauung','Schwindel','Schlecht geschlafen','Heißhunger','Herzklopfen','Gereizt'];
const DEFAULT_LABS=[['HbA1c','%'],['Glukose nüchtern','mg/dl'],['Gesamtcholesterin','mg/dl'],['LDL-Cholesterin','mg/dl'],['HDL-Cholesterin','mg/dl'],['Triglyzeride','mg/dl'],['Harnsäure','mg/dl'],['Kreatinin','mg/dl'],['eGFR','ml/min'],['GPT (ALT)','U/l'],['GOT (AST)','U/l'],['Gamma-GT','U/l'],['Natrium','mmol/l'],['Kalium','mmol/l'],['Magnesium','mmol/l'],['TSH','mU/l'],['CRP','mg/l']];
const $=s=>document.querySelector(s);

/* ---------- helpers ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fd=(s,o)=>pd(s).toLocaleDateString('de-DE',o||{day:'2-digit',month:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{if(v==null||String(v).trim()==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmt=(n,d=1)=>n==null||isNaN(n)?'–':n.toLocaleString('de-DE',{maximumFractionDigits:d});
const vv=x=>x==null?'':String(x).replace('.',',');
const uid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let S;
function load(){
 try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.settings){S={settings:{name:'',start:today(),days:90,carbGoal:50,questions:'',lastBackup:null,meds:[]},days:{},weeks:{},labs:DEFAULT_LABS.map(([n,u])=>({name:n,unit:u,range:'',base:'',end:''})),labDates:{base:today(),end:''},doseChanges:[]}}
 if(!S.settings.meds)S.settings.meds=[];
 if(!S.doseChanges)S.doseChanges=[];
 if(!S.labs)S.labs=[];
 S.labs.forEach(r=>{if(r.range==null)r.range=''});
}
let stT;
function save(msg){
 try{localStorage.setItem(KEY,JSON.stringify(S));status(msg||'Gespeichert')}
 catch(e){status('Speichern fehlgeschlagen – bitte Backup exportieren')}
}
function status(t){const el=$('#status');el.textContent=t;el.classList.add('show');clearTimeout(stT);stT=setTimeout(()=>el.classList.remove('show'),1400)}
const N=()=>Math.max(7,Number(S.settings.days)||90);
const nWeeks=()=>Math.ceil(N()/7);
const weekRange=n=>{const s=addDays(S.settings.start,(n-1)*7);return [s,addDays(s,6)]};
const weekOf=ds=>Math.floor(diffDays(S.settings.start,ds)/7)+1;
function avg(from,to,f){const a=[];for(let i=0;i<=diffDays(from,to);i++){const d=S.days[addDays(from,i)];if(d&&d[f]!=null)a.push(d[f])}return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function countLogged(from,to,f){let n=0;for(let i=0;i<=diffDays(from,to);i++){const d=S.days[addDays(from,i)];if(d&&d[f]!=null)n++}return n}
function prevLoggedValue(field,beforeDate){const dates=Object.keys(S.days).filter(ds=>ds<beforeDate&&S.days[ds][field]!=null).sort();return dates.length?S.days[dates[dates.length-1]][field]:null}
function checkPlausibility(field,value,ref){
 if(value==null)return null;
 const RANGES={w:[30,250],g:[40,300],k:[0,8],sys:[70,220],dia:[40,130],p:[30,200],c:[0,300]};
 const r=RANGES[field];
 if(r&&(value<r[0]||value>r[1]))return 'Ungewöhnlicher Wert — Tippfehler?';
 if(field==='w'&&ref!=null&&Math.abs(value-ref)>4)return 'Großer Sprung seit dem letzten Eintrag — Tippfehler?';
 if(field==='sys'&&ref!=null&&value<=ref)return 'Systolisch sollte höher als diastolisch sein — Tippfehler?';
 return null;
}
function plausMsg(field,d){
 if(field==='sys'||field==='dia')return checkPlausibility('sys',d.sys,d.dia)||checkPlausibility('dia',d.dia,null)||'';
 const ref=field==='w'?prevLoggedValue('w',curDate):null;
 return checkPlausibility(field,d[field],ref)||'';
}
function medAdherence(from,to,medId){let taken=0,logged=0;for(let i=0;i<=diffDays(from,to);i++){const d=S.days[addDays(from,i)];if(d&&d.meds&&d.meds[medId]!==undefined){logged++;if(d.meds[medId])taken++}}return {taken,logged}}
const getDay=ds=>S.days[ds]||(S.days[ds]={});
const getWeek=n=>S.weeks[n]||(S.weeks[n]={});

let curDate=today(), curTab='day';
let curWeek=1;

/* ---------- header + strip ---------- */
function renderHead(){
 const st=S.settings,t=today(),i=diffDays(st.start,t)+1;
 $('#hsub').textContent=(st.name?st.name+', ':'')+(i<1?`Start am ${fd(st.start,{day:'numeric',month:'long'})}`:i>N()?`Zeitraum abgeschlossen (${N()} Tage)`:`Tag ${i} von ${N()}, Woche ${Math.ceil(i/7)}`);
 let h='';
 for(let k=0;k<N();k++){const ds=addDays(st.start,k),d=S.days[ds];const n=d?['w','g','k','sys','c'].filter(f=>d[f]!=null).length:0;
  h+=`<button type="button" data-date="${ds}" class="${n>=4?'done':n?'part':''}${ds===t?' today':''}${ds===curDate&&curTab==='day'?' cur':''}" title="Tag ${k+1}, ${fd(ds)}" aria-label="Tag ${k+1}, ${fd(ds)}"></button>`}
 $('#strip').innerHTML=h;
 const logged=Object.values(S.days).filter(d=>Object.keys(d).length).length;
 const lb=st.lastBackup?diffDays(st.lastBackup,t):null;
 const nd=$('#nudge');
 if(logged>=5&&(lb===null||lb>=7)){nd.hidden=false;nd.innerHTML=`${lb===null?'Noch kein Backup gemacht.':`Letztes Backup vor ${lb} Tagen.`} <button type="button" data-goto="set">Jetzt sichern</button>`}else nd.hidden=true;
}

/* ---------- day ---------- */
function numRow(f,label,hint,unit,d,mode='decimal',warn){
 return `<div class="row"><label for="f_${f}"><b>${label}</b><small>${hint}</small></label><div class="inp"><input id="f_${f}" data-f="${f}" type="text" inputmode="${mode}" autocomplete="off" value="${vv(d[f])}"><span class="unit">${unit}</span></div><small class="hint" id="hint_${f}"${warn?'':' hidden'}>${warn||''}</small></div>`}
function updateHint(field,d){
 const key=(field==='sys'||field==='dia')?'bp':field;
 const el=$('#hint_'+key);if(!el)return;
 const msg=plausMsg(field,d);
 el.textContent=msg;el.hidden=!msg;
}
function scaleRow(f,label,hint,d){
 return `<div class="row"><div class="lbl"><b>${label}</b><small>${hint}</small></div><div class="scale" role="group" aria-label="${label}">${[1,2,3,4,5].map(n=>`<button type="button" data-scale="${f}" data-v="${n}" class="${d[f]===n?'on':''}" aria-pressed="${d[f]===n}">${n}</button>`).join('')}</div></div>`}
function renderDay(){
 const d=S.days[curDate]||{},i=diffDays(S.settings.start,curDate),inR=i>=0&&i<N();
 let h=`<div class="datebar"><button type="button" class="btn" data-nav="-1" aria-label="Vorheriger Tag">‹</button><input type="date" id="dpick" value="${curDate}" aria-label="Datum"><button type="button" class="btn" data-nav="1" aria-label="Nächster Tag">›</button>${curDate!==today()?'<button type="button" class="btn" data-nav="0">Heute</button>':''}</div>
 <p class="sub" style="margin-bottom:12px">${fd(curDate,{weekday:'long',day:'numeric',month:'long'})}${inR?`, Tag ${i+1}`:', außerhalb des Zeitraums'}</p>
 <div class="panel"><h2>Morgens, nüchtern</h2>
 ${numRow('w','Gewicht','nach dem Aufstehen','kg',d,'decimal',plausMsg('w',d))}
 ${numRow('g','Blutzucker','vor Frühstück und Kaffee','mg/dl',d,'numeric',plausMsg('g',d))}
 ${numRow('k','Ketone','Blutmessung','mmol/l',d,'decimal',plausMsg('k',d))}
 <div class="row"><label for="f_sys"><b>Blutdruck</b><small>sitzend, nach 5 min Ruhe</small></label><div class="inp"><input id="f_sys" data-f="sys" type="text" inputmode="numeric" placeholder="sys" value="${vv(d.sys)}" aria-label="systolisch"><span>/</span><input data-f="dia" type="text" inputmode="numeric" placeholder="dia" value="${vv(d.dia)}" aria-label="diastolisch"></div><small class="hint" id="hint_bp"${plausMsg('sys',d)?'':' hidden'}>${plausMsg('sys',d)}</small></div>
 ${numRow('p','Puls','optional, vom Blutdruckgerät','/min',d,'numeric',plausMsg('p',d))}
 </div>
 <div class="panel"><h2>Über den Tag</h2>
 ${numRow('c','Kohlenhydrate',`grob geschätzt, Limit ${S.settings.carbGoal} g`,'g',d,'numeric',plausMsg('c',d))}
 ${scaleRow('en','Energie','1 schlapp, 5 topfit',d)}
 ${scaleRow('hu','Hunger','1 kaum, 5 stark',d)}

function delta(a,b,d=1){const x=num(a),y=num(b);if(x==null||y==null)return '';const dv=y-x;if(dv===0)return '±0';return `<span class="${dv>0?'up':'down'}">${dv>0?'+':'−'}${fmt(Math.abs(dv),d)}</span>`}
function parseRange(str){
 const s=String(str||'').trim();
 let m=s.match(/^<\s*([\d.,]+)$/);
 if(m){const v=num(m[1]);return v==null?{min:null,max:null}:{min:null,max:v}}
 m=s.match(/^>\s*([\d.,]+)$/);
 if(m){const v=num(m[1]);return v==null?{min:null,max:null}:{min:v,max:null}}
 m=s.match(/^([\d.,]+)\s*-\s*([\d.,]+)$/);
 if(m){const lo=num(m[1]),hi=num(m[2]);return (lo==null||hi==null)?{min:null,max:null}:{min:lo,max:hi}}
 return {min:null,max:null};
}
function isOutOfRange(value,range){
 if(value==null)return false;
 const {min,max}=parseRange(range);
 return (min!=null&&value<min)||(max!=null&&value>max);
}
function renderLab(){

 const anyOOR=L.some(r=>isOutOfRange(num(r.base),r.range)||isOutOfRange(num(r.end),r.range));

function chart(title,series,o={}){
 const pts=series.flatMap(s=>s.pts);
 const cap=`<figcaption>${title}${o.unit?` <span class="sub">(${o.unit})</span>`:''}</figcaption>`;
 if(!pts.length)return `<figure class="chart">${cap}<p class="sub">Noch keine Werte.</p></figure>`;
 const n=N(),W=600,H=o.h||170,L=44,R=10,T=10,B=22;
 const ys=pts.map(p=>p[1]);if(o.band)ys.push(...o.band);if(o.goal!=null)ys.push(o.goal);
 let lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.15;if(!pad)pad=Math.abs(hi)*.05||1;lo-=pad;hi+=pad;
 const X=x=>L+x/(n-1)*(W-L-R),Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
 const dec=hi-lo<3?2:hi-lo<15?1:0;
 let g='';
 if(o.band)g+=`<rect class="band" x="${L}" width="${W-L-R}" y="${Y(o.band[1]).toFixed(1)}" height="${(Y(o.band[0])-Y(o.band[1])).toFixed(1)}"/>`;
 for(let i=0;i<=4;i++){const y=lo+(hi-lo)*i/4,py=Y(y).toFixed(1);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${py}" y2="${py}"/><text x="${L-6}" y="${+py+4}" text-anchor="end">${fmt(y,dec)}</text>`}
 for(let w=0;w*7<n;w+=2)g+=`<text x="${X(w*7).toFixed(1)}" y="${H-5}">W${w+1}</text>`;
 if(o.goal!=null)g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(o.goal).toFixed(1)}" y2="${Y(o.goal).toFixed(1)}"/>`;
 if(o.markers)o.markers.filter(mk=>mk.x>=0&&mk.x<n).forEach(mk=>{const mx=X(mk.x).toFixed(1);g+=`<line class="goal" x1="${mx}" x2="${mx}" y1="${T}" y2="${H-B}"/><text x="${mx}" y="${T+9}" transform="rotate(-90,${mx},${T+9})" text-anchor="start">${esc(mk.label)}</text>`});
 series.forEach(s=>{if(!s.pts.length)return;const sp=[...s.pts].sort((a,b)=>a[0]-b[0]);
  g+=`<path class="${s.cls}" d="M${sp.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')}"/>`;
  g+=sp.map(p=>`<circle class="${s.cls}d" r="2.6" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}"/>`).join('')});
 return `<figure class="chart">${cap}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg>${o.note?`<p class="sub">${o.note}</p>`:''}</figure>`;
}

function generateTalkingPoints(){
 const st=S.settings,start=st.start,end=addDays(start,N()-1),pts=[];
 const daysInRange=Object.entries(S.days).filter(([ds,d])=>{const i=diffDays(start,ds);return i>=0&&i<N()&&Object.keys(d).length});

 const avgWeek=(n,f)=>{const [a,b]=weekRange(n);return avg(a,b,f)};
 const findTrendStart=(weeklyVals,threshold)=>{
  if(weeklyVals.length<4)return null;
  const baseline=(weeklyVals[0][1]+weeklyVals[1][1])/2;
  for(let i=2;i<=weeklyVals.length-2;i++){
   const dir=Math.sign(weeklyVals[i][1]-baseline);
   if(dir===0)continue;
   let ok=true;
   for(let j=i;j<weeklyVals.length;j++){
    const diff=weeklyVals[j][1]-baseline;
    if(Math.sign(diff)!==dir||Math.abs(diff)<=threshold){ok=false;break}
   }
   if(ok){const seg=weeklyVals.slice(i);return {week:weeklyVals[i][0],baseline,current:seg.reduce((s,v)=>s+v[1],0)/seg.length,dir}}
  }
  return null;
 };
 const TREND=[
  ['Gewicht','kg',2,1,n=>avgWeek(n,'w')],
  ['Blutdruck systolisch','mmHg',5,0,n=>avgWeek(n,'sys')],
  ['Blutdruck diastolisch','mmHg',3,0,n=>avgWeek(n,'dia')],
  ['Ketone','mmol/l',0.3,2,n=>avgWeek(n,'k')],
  ['Ruhepuls','/min',3,0,n=>{const w=S.weeks[n];return w&&w.rhr!=null?w.rhr:null}]
 ];
 TREND.forEach(([label,unit,threshold,dec,get])=>{
  const weeklyVals=[];
  for(let n=1;n<=nWeeks();n++){const v=get(n);if(v!=null)weeklyVals.push([n,v])}
  const t=findTrendStart(weeklyVals,threshold);
  if(t)pts.push(`${label} seit Woche ${t.week} spürbar ${t.dir>0?'höher':'niedriger'} als in den ersten beiden Wochen (Ø ${fmt(t.baseline,dec)} vs. Ø ${fmt(t.current,dec)} ${unit}).`);
 });

 const over=[],under=[];
 daysInRange.forEach(([,d])=>{if(d.c!=null&&d.k!=null)(d.c>st.carbGoal?over:under).push(d.k)});
 if(over.length>=5&&under.length>=5){
  const avgOver=over.reduce((s,v)=>s+v,0)/over.length,avgUnder=under.reduce((s,v)=>s+v,0)/under.length;
  if(Math.abs(avgOver-avgUnder)>=0.3)pts.push(`An Tagen über dem Kohlenhydrat-Limit lagen die Ketonwerte im Schnitt bei Ø ${fmt(avgOver,2)} mmol/l, an Tagen im Limit bei Ø ${fmt(avgUnder,2)} mmol/l.`);
 }

 const half=N()/2;
 SYMS.forEach(s=>{
  const occ=daysInRange.filter(([,d])=>(d.sym||[]).includes(s));
  if(occ.length<3)return;
  const firstHalf=occ.filter(([ds])=>diffDays(start,ds)<half).length,secondHalf=occ.length-firstHalf;
  if(Math.abs(firstHalf-secondHalf)>=2)pts.push(`${s} in der ersten Hälfte an ${firstHalf} Tagen genannt, in der zweiten Hälfte an ${secondHalf} Tagen.`);
 });

 [...S.doseChanges].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(c=>{
  const beforeStart=addDays(c.date,-7),beforeEnd=addDays(c.date,-1),afterStart=addDays(c.date,1),afterEnd=addDays(c.date,7);
  if(countLogged(beforeStart,beforeEnd,'sys')<4||countLogged(afterStart,afterEnd,'sys')<4)return;
  const sysBefore=avg(beforeStart,beforeEnd,'sys'),sysAfter=avg(afterStart,afterEnd,'sys');
  const diaBefore=avg(beforeStart,beforeEnd,'dia'),diaAfter=avg(afterStart,afterEnd,'dia');
  const sysDiff=Math.abs(sysAfter-sysBefore),diaDiff=(diaBefore!=null&&diaAfter!=null)?Math.abs(diaAfter-diaBefore):0;
  if(sysDiff>=5||diaDiff>=3){
   const med=st.meds.find(m=>m.id===c.medId);
   pts.push(`Nach Anpassung von ${esc(med?med.name:'einem Medikament')} am ${fd(c.date)} (auf ${esc(c.newDose)}) lag der Blutdruck in den Folgetagen bei Ø ${fmt(sysAfter,0)} statt zuvor Ø ${fmt(sysBefore,0)} mmHg (sys).`);
  }
 });

 [['w','Gewicht'],['g','Blutzucker'],['k','Ketone'],['sys','Blutdruck']].forEach(([f,label])=>{
  const pct=countLogged(start,end,f)/N()*100;
  if(pct<70)pts.push(`${label} an nur ${fmt(pct,0)}% der Tage erfasst — die obigen Trends basieren entsprechend auf weniger Werten.`);
 });

 return pts;
}

function reportHTML(){
 const st=S.settings,end=addDays(st.start,N()-1);
 const inR=Object.entries(S.days).filter(([ds,d])=>{const i=diffDays(st.start,ds);return i>=0&&i<N()&&Object.keys(d).length});
 const firstLast=f=>{let fi=null,la=null;for(let w=1;w<=nWeeks();w++){const [a,b]=weekRange(w);const v=avg(a,b,f);if(v!=null){if(!fi)fi=[w,v];la=[w,v]}}return [fi,la]};
 const wfl=f=>{const ws=Object.keys(S.weeks).map(Number).filter(n=>S.weeks[n][f]!=null).sort((a,b)=>a-b);return ws.length?[[ws[0],S.weeks[ws[0]][f]],[ws.at(-1),S.weeks[ws.at(-1)][f]]]:[null,null]};
 const row=(l,u,d,[fi,la])=>`<tr><td>${l}</td><td>${u}</td><td class="num">${fi?fmt(fi[1],d)+` <span class="small">(W${fi[0]})</span>`:'–'}</td><td class="num">${la&&la[0]!==fi[0]?fmt(la[1],d)+` <span class="small">(W${la[0]})</span>`:'–'}</td><td class="num">${fi&&la&&la[0]!==fi[0]?((la[1]-fi[1])>0?'+':(la[1]-fi[1])<0?'−':'±')+fmt(Math.abs(la[1]-fi[1]),d):''}</td></tr>`;
 const DR=[['Gewicht','w','kg',1],['Blutzucker nüchtern','g','mg/dl',0],['Ketone','k','mmol/l',2],['Blutdruck systolisch','sys','mmHg',0],['Blutdruck diastolisch','dia','mmHg',0],['Puls','p','/min',0],['Kohlenhydrate','c','g/Tag',0],['Energie (1–5)','en','',1],['Hunger (1–5)','hu','',1]];
 const WR=[['Bauchumfang','waist','cm',1],['Ruhepuls (Garmin)','rhr','/min',0],['Schlaf (Garmin)','sleep','h',1],['Stress (Garmin)','stress','0–100',0],['Schritte (Garmin)','steps','/Tag',0]];
 const days=inR.map(e=>e[1]);
 const pl=days.filter(d=>d.plan),py=pl.filter(d=>d.plan==='y').length,pt=pl.filter(d=>d.plan==='t').length;
 const kd=days.filter(d=>d.k!=null),kin=kd.filter(d=>d.k>=0.5).length;
 const cd=days.filter(d=>d.c!=null),cOver=cd.filter(d=>d.c>st.carbGoal).length;
 const months=Math.ceil(N()/30);
 const symC=SYMS.map(s=>{const c=Array(months).fill(0);inR.forEach(([ds,d])=>{if((d.sym||[]).includes(s))c[Math.floor(diffDays(st.start,ds)/30)]++});return [s,c]}).filter(([,c])=>c.some(Boolean));
 const labs=S.labs.filter(r=>r.base||r.end);
 const wn=Object.keys(S.weeks).map(Number).sort((a,b)=>a-b).filter(n=>S.weeks[n].note);
 const dn=inR.filter(([,d])=>d.note).sort((a,b)=>a[0]<b[0]?-1:1);
 const charts=chartSet().filter((_,i)=>i!==4&&i!==6);
 const talkingPoints=generateTalkingPoints();
 return `<div class="report">
 <div class="report-title"><p class="overline">Zusammenfassung</p><h1>Keto-Protokoll</h1><p class="subtitle">${st.name?esc(st.name)+' · ':''}Zeitraum ${fd(st.start,{day:'numeric',month:'long',year:'numeric'})} bis ${fd(end,{day:'numeric',month:'long',year:'numeric'})} · Einträge an ${inR.length} von ${N()} Tagen · Kohlenhydrat-Limit ${st.carbGoal} g/Tag</p></div>
 <h2>Verlauf im Überblick</h2>
 <p class="small">Mittelwerte der ersten und der letzten Woche mit Messwerten.</p>
 <table><thead><tr><th>Parameter</th><th>Einheit</th><th class="num">Anfang</th><th class="num">Ende</th><th class="num">Veränderung</th></tr></thead><tbody>
 ${DR.map(([l,f,u,d])=>row(l,u,d,firstLast(f))).join('')}${WR.map(([l,f,u,d])=>row(l,u,d,wfl(f))).join('')}</tbody></table>
 <h2>Umsetzung</h2>
 <p>Im Plan geblieben: ${pl.length?`${py} Tage voll, ${pt} teilweise, ${pl.length-py-pt} nicht (von ${pl.length} Tagen mit Angabe)`:'keine Angaben'}.</p>
 <p>Ketonmessungen: ${kd.length?`${kin} von ${kd.length} bei 0,5 mmol/l oder höher, Mittelwert ${fmt(kd.reduce((s,d)=>s+d.k,0)/kd.length,2)} mmol/l`:'keine'}.</p>
 <p>Kohlenhydrate: ${cd.length?`Ø ${fmt(cd.reduce((s,d)=>s+d.c,0)/cd.length,0)} g/Tag, an ${cOver} von ${cd.length} Tagen über dem Limit`:'keine Angaben'}.</p>
 <h2>Kurven</h2><div class="cg">${charts.join('')}</div>
 <h2>Laborwerte</h2>
 ${labs.length?`<table><thead><tr><th>Parameter</th><th>Einheit</th><th>Normbereich</th><th class="num">Ausgang${S.labDates.base?'<br><span class="small">'+fd(S.labDates.base,{day:'2-digit',month:'2-digit',year:'numeric'})+'</span>':''}</th><th class="num">Abschluss${S.labDates.end?'<br><span class="small">'+fd(S.labDates.end,{day:'2-digit',month:'2-digit',year:'numeric'})+'</span>':''}</th><th class="num">Veränderung</th></tr></thead><tbody>${labs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.unit)}</td><td>${esc(r.range)||'–'}</td><td class="num">${esc(r.base)||'–'}${isOutOfRange(num(r.base),r.range)?'<sup>*</sup>':''}</td><td class="num">${esc(r.end)||'–'}${isOutOfRange(num(r.end),r.range)?'<sup>*</sup>':''}</td><td class="num">${delta(r.base,r.end,2).replace(/<[^>]+>/g,'')}</td></tr>`).join('')}</tbody></table>${labs.some(r=>isOutOfRange(num(r.base),r.range)||isOutOfRange(num(r.end),r.range))?'<p class="small">* außerhalb des angegebenen Normbereichs</p>':''}`:'<p>Keine Laborwerte eingetragen.</p>'}
 ${S.settings.meds.length?`<h2>Medikation</h2>
 <table><thead><tr><th>Name</th><th>Dosis</th><th>Kategorie</th><th class="num">Einnahme (gesamter Zeitraum)</th></tr></thead><tbody>${S.settings.meds.map(m=>{const {taken,logged}=medAdherence(st.start,end,m.id);return `<tr><td>${esc(m.name)}</td><td>${esc(m.dose)}</td><td>${esc(m.category)}</td><td class="num">${logged?fmt(taken/logged*100,0)+' %':'–'} <span class="small">(${logged} Tage erfasst)</span></td></tr>`}).join('')}</tbody></table>
 ${S.doseChanges.length?`<p class="small" style="margin-top:2mm">Dosisänderungen</p><table><thead><tr><th>Datum</th><th>Medikament</th><th>Alte Dosis</th><th>Neue Dosis</th></tr></thead><tbody>${[...S.doseChanges].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(c=>{const m=S.settings.meds.find(x=>x.id===c.medId);return `<tr><td>${fd(c.date)}</td><td>${esc(m?m.name:'–')}</td><td>${esc(c.oldDose)||'–'}</td><td>${esc(c.newDose)}</td></tr>`}).join('')}</tbody></table>`:''}`:''}
 <h2>Beschwerden</h2>
 ${symC.length?`<table><thead><tr><th>Beschwerde</th>${Array.from({length:months},(_,i)=>`<th class="num">Tage ${i*30+1}–${Math.min((i+1)*30,N())}</th>`).join('')}</tr></thead><tbody>${symC.map(([s,c])=>`<tr><td>${s}</td>${c.map(x=>`<td class="num">${x||''}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p>Keine Beschwerden notiert.</p>'}
 ${wn.length||dn.length?`<h2>Notizen</h2>${wn.map(n=>`<p><b>Woche ${n}:</b> ${esc(S.weeks[n].note)}</p>`).join('')}${dn.length?`<p class="small" style="margin-top:2mm">${dn.map(([ds,d])=>`<b>${fd(ds)}</b> ${esc(d.note)}`).join(' &nbsp; ')}</p>`:''}`:''}
 <h2>Beobachtungen für das Gespräch</h2>
 <p class="small">Beobachtungen aus den erfassten Daten, keine medizinische Bewertung — als Gesprächsgrundlage gedacht.</p>
 ${talkingPoints.length?`<ul>${talkingPoints.map(p=>`<li>${p}</li>`).join('')}</ul>`:'<p>Keine auffälligen Muster in diesem Zeitraum.</p>'}
 <h2>Fragen für die Besprechung</h2><div class="qs">${esc(st.questions)}</div>
 <p class="small" style="margin-top:4mm">Keto-Protokoll v${VERSION}</p>
 </div>`;
}

function renderPrint(){
 const def=Math.min(nWeeks(),Math.max(1,weekOf(today())));
 $('#v-print').innerHTML=`<div class="panel"><h2>Kühlschrank-Blatt</h2><p class="sub">Eine Woche auf A4 quer. Leer drucken zum Ausfüllen, oder mit den schon erfassten Werten.</p>
 <div class="row"><label for="pw"><b>Woche</b></label><select id="pw">${Array.from({length:nWeeks()},(_,i)=>{const [a]=weekRange(i+1);return `<option value="${i+1}" ${i+1===def?'selected':''}>Woche ${i+1} (ab ${fd(a)})</option>`}).join('')}</select></div>
 <div class="row"><label for="pfill"><b>Erfasste Werte eintragen</b><small>aus: leeres Blatt</small></label><input id="pfill" type="checkbox" style="width:22px;height:22px;justify-self:end"></div>
 <div class="btns"><button type="button" class="btn primary" id="doSheet">Blatt drucken</button></div></div>
 <div class="panel"><h2>Bericht für die Abschlussbesprechung</h2><p class="sub">Überblick, Kurven, Laborwerte vorher und nachher, Beschwerden und Notizen. Im Druckdialog kannst du auch als PDF speichern.</p>
 <div class="row wide"><label for="pq"><b>Fragen an den Arzt</b><small>sammle sie über die drei Monate hier, sie erscheinen am Ende des Berichts</small></label><textarea id="pq" rows="4">${esc(S.settings.questions)}</textarea></div>
 <div class="btns"><button type="button" class="btn primary" id="doReport">Bericht drucken</button></div></div>`;
}
$('#v-print').addEventListener('change',e=>{if(e.target.id==='pq'){S.settings.questions=e.target.value;save()}});
$('#v-print').addEventListener('click',e=>{
 if(e.target.id==='doSheet')doPrint(sheetHTML(+$('#pw').value,$('#pfill').checked),true);
 if(e.target.id==='doReport'){S.settings.questions=$('#pq').value;save();doPrint(reportHTML(),false)}
});

/* ---------- settings ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function renderSet(){
 const st=S.settings;
 $('#v-set').innerHTML=`<div class="panel"><h2>Zeitraum</h2>
 <div class="row"><label for="s_name"><b>Name</b><small>erscheint auf Blatt und Bericht</small></label><input id="s_name" data-s="name" value="${esc(st.name)}"></div>
 <div class="row"><label for="s_start"><b>Start</b></label><input id="s_start" type="date" data-s="start" value="${st.start}"></div>
 <div class="row"><label for="s_days"><b>Dauer</b><small>in Tagen</small></label><div class="inp"><input id="s_days" data-s="days" inputmode="numeric" value="${st.days}"><span class="unit">Tage</span></div></div>
 <div class="row"><label for="s_carb"><b>Kohlenhydrat-Limit</b><small>wie mit dem Arzt abgesprochen</small></label><div class="inp"><input id="s_carb" data-s="carbGoal" inputmode="numeric" value="${st.carbGoal}"><span class="unit">g/Tag</span></div></div></div>
 <div class="panel scroll"><h2>Medikamente</h2><p class="sub">Einmal definieren, im Tagesprotokoll täglich abhaken.</p><table class="labtbl"><thead><tr><th>Name</th><th>Dosis</th><th>Kategorie</th><th></th><th></th></tr></thead><tbody>
 ${st.meds.map((m,i)=>`<tr><td><input data-mi="${i}" data-mk="name" value="${esc(m.name)}" aria-label="Name"></td><td style="width:100px"><input data-mi="${i}" data-mk="dose" value="${esc(m.dose)}" aria-label="Dosis"></td><td style="width:150px"><select data-mi="${i}" data-mk="category" aria-label="Kategorie"><option value="Medikament" ${m.category==='Medikament'?'selected':''}>Medikament</option><option value="Nahrungsergänzung" ${m.category==='Nahrungsergänzung'?'selected':''}>Nahrungsergänzung</option></select></td><td style="width:100px"><button type="button" class="btn" data-mdose="${i}" style="padding:4px 8px;font-size:.85rem">Dosis geändert</button></td><td style="width:36px"><button type="button" class="btn" data-mdel="${i}" aria-label="${esc(m.name)} entfernen" style="padding:4px 8px">✕</button></td></tr>`).join('')}
 </tbody></table><div class="btns"><button type="button" class="btn" id="medAdd">Medikament hinzufügen</button></div></div>
 <div class="panel"><h2>Backup</h2><p class="sub">Die Daten liegen nur in diesem Browser. Sichere sie regelmäßig, und übertrage sie so auch zwischen Handy und Rechner.${st.lastBackup?` Letztes Backup: ${fd(st.lastBackup,{day:'numeric',month:'long'})}.`:''}</p>
 <div class="btns"><button type="button" class="btn primary" id="exp">Backup speichern</button><button type="button" class="btn" id="imp">Backup laden</button><button type="button" class="btn" id="csv">Tageswerte als CSV</button></div></div>
 <div class="panel"><h2>Alles löschen</h2><p class="sub">Entfernt alle Einträge aus diesem Browser.</p><div class="btns"><button type="button" class="btn danger" id="reset">Alle Daten löschen</button></div></div>
 <p class="sub" style="text-align:center">Keto-Protokoll v${VERSION}</p>`;
}
$('#v-set').addEventListener('change',e=>{
 const t=e.target,k=t.dataset.s;
 if(k){
  if(k==='days'||k==='carbGoal'){const n=num(t.value);if(n==null||n<=0){status('Bitte eine Zahl eingeben');return}S.settings[k]=Math.round(n)}
  else if(k==='start'){if(!t.value)return;S.settings.start=t.value}
  else S.settings[k]=t.value.trim();
  save();curWeek=Math.min(nWeeks(),Math.max(1,weekOf(today())));renderHead();return
 }
 if(t.dataset.mi!=null){S.settings.meds[+t.dataset.mi][t.dataset.mk]=t.value.trim();save()}
});
$('#v-set').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const id=b.id;
 if(id==='exp'){S.settings.lastBackup=today();save('Backup erstellt');download(`keto-protokoll-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json');renderSet();renderHead()}
 if(id==='imp')$('#importFile').click();
 if(id==='csv'){const f=['w','g','k','sys','dia','p','c','en','hu','plan'];const hd=['Datum','Tag','Gewicht_kg','Blutzucker_mgdl','Ketone_mmolL','RR_sys','RR_dia','Puls','KH_g','Energie','Hunger','Im_Plan','Beschwerden','Notiz'];
  const rows=Object.keys(S.days).sort().map(ds=>{const d=S.days[ds];return [ds,diffDays(S.settings.start,ds)+1,...f.map(k=>d[k]==null?'':String(d[k]).replace('.',',')),(d.sym||[]).join(', '),(d.note||'').replace(/[\r\n;]+/g,' ')].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')});
  download(`keto-protokoll-${today()}.csv`,'\ufeff'+[hd.join(';'),...rows].join('\r\n'),'text/csv')}
 if(id==='reset'&&confirm('Wirklich alle Daten löschen? Das lässt sich nicht rückgängig machen.')){localStorage.removeItem(KEY);load();curDate=today();renderAll();status('Gelöscht')}
 if(id==='medAdd'){S.settings.meds.push({id:uid(),name:'',dose:'',category:'Medikament'});save();renderSet();const ins=document.querySelectorAll('#v-set input[data-mk="name"]');ins[ins.length-1].focus()}
 else if(b.dataset.mdel!=null){const m=S.settings.meds[+b.dataset.mdel];if((m.name||m.dose)&&!confirm(`"${m.name||'Medikament'}" entfernen?`))return;S.settings.meds.splice(+b.dataset.mdel,1);save('Entfernt');renderSet()}
 else if(b.dataset.mdose!=null){const m=S.settings.meds[+b.dataset.mdose];const nv=prompt(`Neue Dosis für ${m.name||'dieses Medikament'}:`,m.dose||'');if(nv==null||!nv.trim())return;const dt=prompt('Datum der Änderung (JJJJ-MM-TT):',today());if(dt==null||!/^\d{4}-\d{2}-\d{2}$/.test(dt))return;S.doseChanges.push({date:dt,medId:m.id,oldDose:m.dose,newDose:nv.trim()});m.dose=nv.trim();save('Dosis aktualisiert');renderSet()}
});
$('#importFile').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!d.days)throw 0;if(!confirm('Backup laden? Die aktuellen Daten in diesem Browser werden ersetzt.'))return;S=d;S.weeks=S.weeks||{};S.labs=S.labs||[];S.labs.forEach(r=>{if(r.range==null)r.range=''});S.labDates=S.labDates||{};S.settings.meds=S.settings.meds||[];S.doseChanges=S.doseChanges||[];save('Backup geladen');renderAll()}catch(err){status('Datei ist kein gültiges Backup')}e.target.value=''};
 r.readAsText(file);
});

/* ---------- tabs ---------- */
const R={day:renderDay,week:renderWeek,lab:renderLab,trend:renderTrend,print:renderPrint,set:renderSet};
function show(tab){curTab=tab;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));Object.keys(R).forEach(k=>$('#v-'+k).hidden=k!==tab);R[tab]();renderHead()}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
$('#strip').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(!b)return;curDate=b.dataset.date;show('day')});
$('#nudge').addEventListener('click',e=>{if(e.target.dataset.goto)show(e.target.dataset.goto)});
function renderAll(){curWeek=Math.min(nWeeks(),Math.max(1,weekOf(today())));show(curTab)}

$('#verline').textContent='v'+VERSION;
load();renderAll();

/* Registers sw.js for offline support. Only takes effect over HTTPS (e.g. GitHub
   Pages) — 'serviceWorker' is undefined under file://, so this silently no-ops
   there. sw.js's CACHE_NAME carries its own copy of VERSION; bump both by hand
   together whenever VERSION changes, so every release invalidates the old cache. */
if('serviceWorker' in navigator){
 try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
