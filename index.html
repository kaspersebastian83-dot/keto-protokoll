<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keto-Protokoll</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1D3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style id="pagestyle">@page{size:A4 portrait;margin:12mm}</style>
<style>
:root{--paper:#FAFCFE;--grid:#E6EDF5;--ink:#1D3A6B;--text:#22272E;--muted:#667281;--line:#C9D4E0;--field:#FFFFFF;--keto:#0F7F73;--ketoBand:rgba(15,127,115,.13);--s2:#B4541F;--warn:#B42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161D;--grid:#19212B;--ink:#9CB9EA;--text:#E3E8EF;--muted:#8E99A8;--line:#2C3744;--field:#161D26;--keto:#4FC7B6;--ketoBand:rgba(79,199,182,.15);--s2:#E89A63;--warn:#F07A6E}}
:root[data-theme="dark"]{--paper:#11161D;--grid:#19212B;--ink:#9CB9EA;--text:#E3E8EF;--muted:#8E99A8;--line:#2C3744;--field:#161D26;--keto:#4FC7B6;--ketoBand:rgba(79,199,182,.15);--s2:#E89A63;--warn:#F07A6E}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header h1{font-weight:600;font-size:1.7rem;line-height:1.2;color:var(--ink);margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.nudge{font-size:.85rem;color:var(--s2);margin:4px 0 0}
.nudge button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin:12px 0 16px}
.strip button{aspect-ratio:1;border:1px solid var(--line);background:var(--field);border-radius:2px;padding:0;cursor:pointer;min-width:0;position:relative}
.strip .part{background:var(--ketoBand);border-color:var(--keto)}
.strip .done{background:var(--keto);border-color:var(--keto)}
.strip .today{outline:2px solid var(--ink);outline-offset:1px}
.strip .cur{border:2px solid var(--s2)}
.strip .alert-dot{position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--ink);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;scrollbar-width:none;-ms-overflow-style:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panel{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.panel h2{font-size:1.05rem;font-weight:600;color:var(--ink);margin:0 0 4px}
.warnpanel{border:2px solid var(--warn)}
.warnpanel p{color:var(--warn);font-weight:600;margin:0 0 10px}
.warnpanel ul{margin:0 0 10px;padding-left:20px;color:var(--text);font-weight:400}
.warnpanel li{margin:2px 0}
.warnpanel p.small{color:var(--muted);font-weight:400;font-size:.85rem;margin:0}
.row{display:grid;grid-template-columns:1fr 170px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.wide{grid-template-columns:1fr}
.row label b{display:block;font-weight:500}
.row label small,.row .lbl small{color:var(--muted);font-size:.82rem}
.row .lbl b{display:block;font-weight:500}
.inp{display:flex;align-items:center;gap:6px}
input,textarea,select{font:inherit;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.unit{color:var(--muted);font-size:.82rem;min-width:3.6em}
.hint{grid-column:1/-1;color:var(--s2);font-size:.78rem;margin-top:2px}
.bp-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.bp-line b{flex:0 0 auto;min-width:150px;font-weight:500;font-size:.92rem}
.bp-line .inp{flex:1 1 170px}
.bp-avg{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.today-progress{color:var(--muted);font-size:.9rem;margin:6px 0 12px}
.today-measurement{border-bottom:1px dashed var(--line)}
.today-measurement:last-child{border-bottom:0}
.today-measurement .row{border-bottom:0}
.today-complete>summary,.today-extra>summary{min-height:44px;padding:10px 2px;cursor:pointer;overflow-wrap:anywhere}
.today-complete>summary{color:var(--text)}
.today-summary-main{display:inline-flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;max-width:100%;vertical-align:top}
.today-value{font-weight:600}
.today-action{color:var(--muted);font-size:.85rem}
.today-warning{display:block;color:var(--s2);font-size:.78rem;margin-top:4px}
.today-extra>summary{font-size:1.05rem;font-weight:600;color:var(--ink)}
.today-extra-count{font-size:.85rem;font-weight:400;color:var(--muted)}
.weekly-checkin-card p:not(.sub){margin:10px 0 12px}
.weekly-checkin-card .btn{min-height:44px}
#v-day input,#v-day .scale button,#v-day .seg button,#v-day .chips button,#v-day .datebar .btn,#v-week input,#v-week select,#v-week .datebar .btn{min-height:44px}
#v-week #wsel{height:44px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scale,.seg{display:flex;gap:4px}
.scale button,.seg button,.chips button,.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;font:inherit;color:var(--text);cursor:pointer;padding:8px 10px}
.scale button,.seg button{flex:1;padding:8px 0}
.scale button.on,.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border-radius:999px;padding:5px 12px;font-size:.9rem}
.chips button.on{background:var(--s2);border-color:var(--s2);color:#fff}
.ms-weekdays{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.ms-weekdays button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--text);font:inherit;cursor:pointer}
.ms-weekdays button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.badge{display:inline-block;font-size:.78rem;color:var(--keto);background:var(--ketoBand);padding:2px 9px;border-radius:999px;margin:5px 0}
.lit-item{padding:12px 0}
.lit-item label{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.lit-item input[type="checkbox"]{width:18px;height:18px;flex:none;margin-top:2px}
.lit-note{font-style:italic;color:var(--muted);font-size:.85rem;margin:5px 0 0}
.lit-item a{display:inline-block;margin-top:6px;font-size:.9rem}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.datebar input{flex:1}
.datebar .btn{min-width:44px;font-size:1.2rem;padding:6px 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:500;color:var(--muted)}
td.num,th.num{text-align:right}
.labtbl input{padding:5px 6px}
.labtbl td{padding:4px}
.up{color:var(--s2)}.down{color:var(--keto)}
.oor{color:var(--warn)}
.chart{margin:0 0 18px}
.chart figcaption{font-weight:500;margin-bottom:2px}
.chart svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.s1,.s2,.s3{fill:none;stroke-width:2;stroke-linejoin:round}
.s1{stroke:var(--ink)}.s1d{fill:var(--ink)}
.s2{stroke:var(--s2)}.s2d{fill:var(--s2)}
.s3{stroke:var(--keto)}.s3d{fill:var(--keto)}
.band{fill:var(--ketoBand)}
.goal{fill:none;stroke:var(--warn);stroke-dasharray:5 4;stroke-width:1.3}
.key{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 10px}
#status{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:4px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#status.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:540px){.row{grid-template-columns:1fr 140px}.strip{grid-template-columns:repeat(15,1fr)}header h1{font-size:1.45rem}}
@media (max-width:450px){
 #v-day .row:not(.wide),#v-week .row:not(.wide){grid-template-columns:minmax(0,1fr);gap:5px}
 #v-day .row .inp,#v-week .row .inp{width:100%;min-width:0}
 #v-day .scale button,#v-day .seg button{min-width:0}
 #v-day .bp-line{gap:5px;width:100%;min-width:0}
 #v-day .bp-line b{flex:1 1 100%;min-width:0}
 #v-day .bp-line .inp{flex:1 1 100%}
 #v-day .bp-line input{flex:1 1 0;min-width:0}
 #v-day .weekly-checkin-card .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#print{display:none}

/* ---------- print ---------- */
@media print{
 :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--paper:#fff;--grid:#fff;--ink:#1D3A6B;--text:#000;--muted:#555;--line:#bbb;--field:#fff;--keto:#0F7F73;--ketoBand:rgba(15,127,115,.13);--s2:#B4541F;--warn:#B42318;--hair:#e5e9ef;--inkwash:#1D3A6B0D}
 :root{padding:0}
 body{background:#fff;color:#000;font-size:10.5pt}
 body>*:not(#print){display:none!important}
 #print{display:block}
}
/* ===== fridge sheet ===== */
.sheet table{table-layout:fixed;width:100%;border-collapse:collapse}
.sheet th,.sheet td{padding:.35mm 2mm;color:#000}
.sheet .band{background:var(--ink);color:#fff;padding:2.6mm 0;margin:0 0 1.6mm;display:flex;justify-content:space-between;align-items:center}
.sheet .band .l{display:flex;align-items:baseline}
.sheet .band .r{color:#c3cfe4;font-size:9.2pt}
.sheet .band .wk-title{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:19pt;color:#fff;display:inline;border:0;padding:0;margin:0}
.sheet .band .range{font-size:10pt;color:#c3cfe4;margin-left:3mm}
.sheet .daycell{text-align:center;padding:1.2mm 0 .8mm;border:.5pt solid var(--line)}
.sheet .daynum{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:19pt;color:var(--ink);display:block;line-height:1}
.sheet .dayname{font-size:8.4pt;color:var(--muted)}
.sheet .rowlabel{width:40mm;text-align:left;font-weight:600;font-size:9.4pt;line-height:1.15;border:.5pt solid var(--line)}
.sheet .rowlabel small{display:block;font-weight:400;color:#555;font-size:7.6pt;line-height:1.15}
.sheet td.cell{border:.5pt solid var(--line);height:10mm;font-size:11pt;line-height:1.1;text-align:center}
.sheet tbody.zone-vitals{background:var(--inkwash)}
.sheet tbody.zone-vitals td.cell{height:7.3mm}
.sheet tbody.zone-lifestyle td.cell{height:8mm;font-size:10.3pt}
.sheet .ok{color:var(--keto);font-weight:600}
.sheet .empty{color:var(--line)}
.sheet .bp2{display:block;font-size:8.6pt;line-height:1.2}
.sheet .ruled{background-image:repeating-linear-gradient(#fff 0 7.4mm,var(--hair) 7.4mm 7.6mm);background-position:0 4mm}
.sheet tr.tall td.cell{height:15mm}
.sheet .wk-wrap{border-top:.8pt solid var(--ink);margin-top:1.1mm;padding-top:.6mm}
.sheet .wk-label{font-family:Georgia,"Times New Roman",serif;font-size:9pt;font-weight:600;color:var(--ink);margin:0 0 1mm}
.sheet .wk{display:grid;grid-template-columns:repeat(5,1fr) 2.2fr;gap:2mm}
.sheet .wk div{border:.6pt solid #666;padding:.8mm 2mm;min-height:9mm;font-size:8.5pt;color:#333;line-height:1.2}
.sheet .wk b{display:block;font-size:11pt;color:#000;margin-top:.5mm}
.sheet .foot{font-size:7.5pt;color:#555;margin:1.2mm 0 0}
.sheet .alert-foot{color:var(--warn);font-weight:600;margin:.4mm 0 0}

/* ===== doctor report ===== */
.report-title{margin-bottom:0}
.report-title .tag{display:inline-block;font-size:8.3pt;color:var(--keto);font-weight:500;background:var(--ketoBand);padding:1.6mm 3mm;border-radius:2px;margin-bottom:4mm}
.report h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:27pt;color:var(--ink);letter-spacing:-.01em;line-height:1.05;margin:0}
.report-title .subtitle{font-size:10.3pt;color:var(--muted);margin-top:2mm}
.report-title .rule{height:1pt;background:var(--ink);margin:5mm 0 6mm}
.report .stats{width:100%;border-collapse:collapse;margin-bottom:9mm}
.report .stats td{width:33.33%;padding:0 6mm 0 0;vertical-align:top;border-right:.6pt solid var(--line)}
.report .stats td:last-child{border-right:0;padding-right:0}
.report .stats td:not(:first-child){padding-left:6mm}
.report .stat-n{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:19pt;display:block}
.report .stat-l{font-size:8.4pt;color:var(--muted);margin-top:.8mm}
.report .stat-n.down{color:var(--keto)}.report .stat-n.up{color:var(--s2)}.report .stat-n.flat{color:var(--ink)}
.report h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:13.5pt;color:var(--ink);margin:9mm 0 3mm;padding-left:3mm;border-left:2.6pt solid var(--ink);break-after:avoid;break-inside:avoid}
.report h2:first-of-type{margin-top:0}
.report h2+*{break-inside:avoid}
.report table{font-size:9.5pt}
.report table.data td{padding:1.9mm 2.5mm;border-bottom:.4pt solid var(--hair)}
.report table.data th{border-bottom:1pt solid var(--ink)}
.report table.data tr:nth-child(even) td{background:var(--inkwash)}
.report table.data td.num,.report table.data th.num{font-variant-numeric:tabular-nums}
.report .cg{display:grid;grid-template-columns:1fr 1fr;gap:5mm 6mm;align-items:start}
.report .chart{break-inside:avoid;margin:0}
.report .chart figcaption{margin-bottom:1mm;line-height:1.2;font-size:8.6pt;font-weight:500;color:var(--ink)}
.report .chart .sub{margin:.5mm 0 0;font-size:7.5pt;line-height:1.2}
.report .chart text{font-size:13px}
.report p{margin:1mm 0}
.report ul{margin:1mm 0;padding-left:4mm}
.report li{margin:.5mm 0}
.report .small{font-size:8.5pt;color:#444}
.report .callout{background:var(--ketoBand);border-left:2.6pt solid var(--keto);padding:4mm 5mm;margin-top:2mm}
.report .callout p.note{font-size:8.3pt;color:var(--muted);margin-bottom:2.4mm;margin-top:0;font-style:italic}
.report .callout ul{padding-left:4mm;margin-top:0}
.report .callout li{margin:1.6mm 0}
.report .qs{white-space:pre-wrap;border:.6pt solid #999;padding:2mm 3mm;min-height:30mm}
.report .refs{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:8.3pt;color:#333;margin:0;padding:0;list-style:none}
.report .refs li{padding-left:5mm;text-indent:-5mm;margin:1.6mm 0}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Keto-Protokoll</h1>
  <p class="sub" id="hsub"></p>
  <p class="sub" id="verline" style="font-size:.75rem"></p>
  <p class="nudge" id="nudge" hidden></p>
 </header>
 <div class="strip" id="strip" aria-label="Übersicht aller Tage"></div>
 <nav role="tablist">
  <button role="tab" data-tab="day" aria-selected="true">Heute</button>
  <button role="tab" data-tab="week" aria-selected="false">Woche</button>
  <button role="tab" data-tab="lab" aria-selected="false">Labor</button>
  <button role="tab" data-tab="trend" aria-selected="false">Verlauf</button>
  <button role="tab" data-tab="print" aria-selected="false">Drucken</button>
  <button role="tab" data-tab="set" aria-selected="false">Einstellungen</button>
  <button role="tab" data-tab="lit" aria-selected="false">Literatur</button>
 </nav>
 <main>
  <section id="v-day"></section>
  <section id="v-week" hidden></section>
  <section id="v-lab" hidden></section>
  <section id="v-trend" hidden></section>
  <section id="v-print" hidden></section>
  <section id="v-set" hidden></section>
  <section id="v-lit" hidden></section>
 </main>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div id="print"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const KEY='ketoProtokoll_v1';

 if(remaining<=7&&remaining>0){
  nd.hidden=false;nd.innerHTML=`Der aktuelle Zeitraum endet in ${remaining} ${remaining===1?'Tag':'Tagen'} — Zeitraum verlängern oder neuen Durchgang starten? <button type="button" data-goto="set">Zu den Einstellungen</button>`;
 }else if(i>N()){
  nd.hidden=false;nd.innerHTML=`Der aktuelle Zeitraum ist abgeschlossen — Zeitraum verlängern oder neuen Durchgang starten? <button type="button" data-goto="set">Zu den Einstellungen</button>`;
 }else if(backupUrgency()==='warn'){
  const lb=daysSinceBackup();
  nd.hidden=false;nd.innerHTML=`Letztes Backup vor ${lb} Tagen. <button type="button" data-goto="set">Jetzt sichern</button>`;
 }else{
  // 'critical' escalates to the warning panel on the Heute tab instead of the header nudge; 'none' shows nothing.
  nd.hidden=true;
 }
}

function numRow(f,label,hint,unit,d,mode='decimal',warn){

function updateHint(field,d){

 const msg=plausMsg(field,d);
 el.textContent=msg;el.hidden=!msg;
}
function setHint(id,msg){const el=$('#'+id);if(!el)return;el.textContent=msg;el.hidden=!msg}
function updateBPUI(d){
 setHint('hint_bp1',bpReadingMsg(d.sys1,d.dia1));
 setHint('hint_bp2',bpReadingMsg(d.sys2,d.dia2));
 setHint('hint_bpdiff',bpDiffMsg(d));

 const show=d.sys1!=null&&d.dia1!=null&&d.sys2!=null&&d.dia2!=null;

function bpRowHTML(d){

function backupWarnHTML(){

 h+=`${quick?medHTML:''}<div class="panel"><h2>Über den Tag</h2>

 else if(b.dataset.med){const id=b.dataset.med,v=b.dataset.mv==='1';d.meds=d.meds||{};if(d.meds[id]===v)delete d.meds[id];else d.meds[id]=v;if(!Object.keys(d.meds).length)delete d.meds}
 else return;

const WF=[['waist','Bauchumfang','auf Nabelhöhe, morgens','cm'],['rhr','Ruhepuls','Garmin, Ø der Woche','/min'],['sleep','Schlaf','Garmin, Ø pro Nacht','h'],['stress','Stress','Garmin, Ø der Woche','0–100'],['steps','Schritte','Garmin, Ø pro Tag','/Tag']];
function weeklyCheckinProgress(n){
 const w=S.weeks[n]||{};
 return {completed:WF.filter(([field])=>w[field]!=null).length,total:WF.length};
}
function weeklyCheckinComplete(n){
 const {completed,total}=weeklyCheckinProgress(n);
 return completed===total;
}
function weeklyCheckinDueWeek(date=today()){
 const dayIndex=diffDays(S.settings.start,date);
 if(dayIndex<0||dayIndex>=N())return null;
 const currentWeek=weekOf(date),periodEnd=addDays(S.settings.start,N()-1);
 const weekEnd=weekRange(currentWeek)[1];
 if(date===(weekEnd<periodEnd?weekEnd:periodEnd)&&!weeklyCheckinComplete(currentWeek))return currentWeek;
 const previousWeek=currentWeek-1;
 return previousWeek>=1&&!weeklyCheckinComplete(previousWeek)?previousWeek:null;
}
function renderWeek(){
 const w=S.weeks[curWeek]||{},[a,b]=weekRange(curWeek);
 const meds=S.settings.meds.filter(m=>medAppliesInRange(m,a,b));

 let h=`<div class="datebar"><button type="button" class="btn" data-wnav="-1" aria-label="Vorherige Woche">‹</button><select id="wsel" aria-label="Woche">${Array.from({length:nWeeks()},(_,i)=>`<option value="${i+1}" ${i+1===curWeek?'selected':''}>Woche ${i+1}</option>`).join('')}</select><button type="button" class="btn" data-wnav="1" aria-label="Nächste Woche">›</button></div>
 <p class="sub" style="margin-bottom:12px">${fd(a,{day:'numeric',month:'long'})} bis ${fd(b,{day:'numeric',month:'long'})}</p>
 <div class="panel"><h2>Einmal pro Woche</h2><p class="sub">Die Garmin-Werte liest du in Garmin Connect in der Wochenansicht ab.</p>
 ${WF.map(([f,l,hint,u])=>`<div class="row"><label for="w_${f}"><b>${l}</b><small>${hint}</small></label><div class="inp"><input id="w_${f}" data-wf="${f}" type="text" inputmode="decimal" value="${vv(w[f])}"><span class="unit">${u}</span></div></div>`).join('')}
 <div class="row wide"><label for="w_note"><b>Wochennotiz</b><small>Wie lief die Woche? Was ist aufgefallen?</small></label><textarea id="w_note" data-wt="note">${esc(w.note)}</textarea></div></div>
 <div class="panel"><h2>Durchschnitt aus deinen Tageswerten</h2><table>${avgs.map(([l,f,u,dd])=>`<tr><td>${l}</td><td class="num">${fmt(avg(a,b,f),dd)} <span class="unit">${u}</span></td></tr>`).join('')}</table></div>
 ${meds.length?`<div class="panel"><h2>Einnahme diese Woche</h2><table>${meds.map(m=>{const {taken,logged}=medAdherence(a,b,m);return `<tr><td>${esc(m.name)}</td><td class="num">${logged?fmt(taken/logged*100,0)+' %':'–'} <span class="unit">${logged? taken+'/'+logged+' Tage':'keine Angaben'}</span></td></tr>`}).join('')}</table></div>`:''}`;
 $('#v-week').innerHTML=h;
}
$('#v-week').addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='wsel'){curWeek=+t.value;renderWeek();return}

/* ---------- lab ---------- */
function delta(a,b,d=1){const x=num(a),y=num(b);if(x==null||y==null)return '';const dv=y-x;if(dv===0)return '±0';return `<span class="${dv>0?'up':'down'}">${dv>0?'+':'−'}${fmt(Math.abs(dv),d)}</span>`}
function parseRange(str){
 const s=String(str||'').trim();
 let m=s.match(/^<\s*([\d.,]+)$/);
 if(m){const v=num(m[1]);return v==null?{min:null,max:null}:{min:null,max:v}}
 m=s.match(/^>\s*([\d.,]+)$/);
 if(m){const v=num(m[1]);return v==null?{min:null,max:null}:{min:v,max:null}}
 m=s.match(/^([\d.,]+)\s*-\s*([\d.,]+)$/);
 if(m){const lo=num(m[1]),hi=num(m[2]);return (lo==null||hi==null)?{min:null,max:null}:{min:lo,max:hi}}
 return {min:null,max:null};
}
function isOutOfRange(value,range){
 if(value==null)return false;
 const {min,max}=parseRange(range);
 return (min!=null&&value<min)||(max!=null&&value>max);
}
function renderLab(){
 const L=S.labs;
 const oorCell=(f,lk,r,i)=>{const out=isOutOfRange(num(r[lk]),r.range);return `<input data-li="${i}" data-lk="${lk}" inputmode="decimal" value="${esc(r[lk])}" aria-label="${esc(r.name)} ${f}"${out?' class="oor"':''}>${out?'<sup class="oor">*</sup>':''}`};
 const anyOOR=L.some(r=>isOutOfRange(num(r.base),r.range)||isOutOfRange(num(r.end),r.range));
 $('#v-lab').innerHTML=`<div class="panel"><h2>Laborwerte</h2><p class="sub">Aus dem Befund übertragen, Einheiten wie im Befund. Eigene Werte kannst du unten ergänzen.</p>
 <div class="row"><label for="lb_base"><b>Ausgangswert vom</b></label><input id="lb_base" type="date" data-ld="base" value="${S.labDates.base||''}"></div>
 <div class="row"><label for="lb_end"><b>Abschlusswert vom</b></label><input id="lb_end" type="date" data-ld="end" value="${S.labDates.end||''}"></div></div>
 <div class="panel scroll"><table class="labtbl"><thead><tr><th>Parameter</th><th>Einheit</th><th>Normbereich</th><th class="num">Ausgang</th><th class="num">Abschluss</th><th class="num">Δ</th><th></th></tr></thead><tbody>
 ${L.map((r,i)=>`<tr><td><input data-li="${i}" data-lk="name" value="${esc(r.name)}" aria-label="Parameter"></td><td style="width:90px"><input data-li="${i}" data-lk="unit" value="${esc(r.unit)}" aria-label="Einheit"></td><td style="width:90px"><input data-li="${i}" data-lk="range" value="${esc(r.range)}" aria-label="${esc(r.name)} Normbereich" placeholder="z.B. 70-99"></td><td style="width:90px">${oorCell('Ausgang','base',r,i)}</td><td style="width:90px">${oorCell('Abschluss','end',r,i)}</td><td class="num" style="width:60px">${delta(r.base,r.end,2)}</td><td style="width:36px"><button type="button" class="btn" data-ldel="${i}" aria-label="${esc(r.name)} entfernen" style="padding:4px 8px">✕</button></td></tr>`).join('')}
 </tbody></table>${anyOOR?'<p class="small" style="margin-top:6px">* außerhalb des angegebenen Normbereichs</p>':''}<div class="btns"><button type="button" class="btn" id="labAdd">Parameter hinzufügen</button></div></div>`;
}

function chart(title,series,o={}){
 const pts=series.flatMap(s=>s.pts);
 const cap=`<figcaption>${title}${o.unit?` <span class="sub">(${o.unit})</span>`:''}</figcaption>`;
 if(!pts.length&&!o.goalSteps)return `<figure class="chart">${cap}<p class="sub">Noch keine Werte.</p></figure>`;
 const n=N(),W=600,H=o.h||170,L=44,R=10,T=10,B=22;
 const ys=pts.map(p=>p[1]);if(o.band)ys.push(...o.band);if(o.goal!=null)ys.push(o.goal);if(o.goalSteps)ys.push(...o.goalSteps.map(p=>p[1]));
 let lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.15;if(!pad)pad=Math.abs(hi)*.05||1;lo-=pad;hi+=pad;
 const X=x=>L+x/(n-1)*(W-L-R),Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
 const dec=hi-lo<3?2:hi-lo<15?1:0;
 let g='';
 if(o.band)g+=`<rect class="band" x="${L}" width="${W-L-R}" y="${Y(o.band[1]).toFixed(1)}" height="${(Y(o.band[0])-Y(o.band[1])).toFixed(1)}"/>`;
 for(let i=0;i<=4;i++){const y=lo+(hi-lo)*i/4,py=Y(y).toFixed(1);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${py}" y2="${py}"/><text x="${L-6}" y="${+py+4}" text-anchor="end">${fmt(y,dec)}</text>`}
 for(let w=0;w*7<n;w+=2)g+=`<text x="${X(w*7).toFixed(1)}" y="${H-5}">W${w+1}</text>`;
 if(o.goal!=null)g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(o.goal).toFixed(1)}" y2="${Y(o.goal).toFixed(1)}"/>`;
 if(o.goalSteps){
  const steps=o.goalSteps;
  let path=`M${X(0).toFixed(1)},${Y(steps[0][1]).toFixed(1)}`;
  for(let i=1;i<steps.length;i++)path+=`H${X(steps[i][0]).toFixed(1)}V${Y(steps[i][1]).toFixed(1)}`;
  path+=`H${X(n-1).toFixed(1)}`;
  g+=`<path class="goal" d="${path}"/>`;
 }
 if(o.markers)o.markers.filter(mk=>mk.x>=0&&mk.x<n).forEach(mk=>{const mx=X(mk.x).toFixed(1);g+=`<line class="goal" x1="${mx}" x2="${mx}" y1="${T}" y2="${H-B}"/><text x="${mx}" y="${T+9}" transform="rotate(-90,${mx},${T+9})" text-anchor="start">${esc(mk.label)}</text>`});
 series.forEach(s=>{if(!s.pts.length)return;const sp=[...s.pts].sort((a,b)=>a[0]-b[0]);

 return `<figure class="chart">${cap}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg>${o.note?`<p class="sub">${o.note}</p>`:''}</figure>`;
}

function chart2(labelA,ptsA,unitA,labelB,ptsB,unitB){
 const cap=`<figcaption>${labelA} <span class="sub">(${unitA})</span> / ${labelB} <span class="sub">(${unitB})</span></figcaption>`;
 if(!ptsA.length||!ptsB.length)return `<figure class="chart">${cap}<p class="sub">Für diese Kombination liegen noch keine gemeinsamen Werte vor.</p></figure>`;
 const n=N(),W=600,H=170,L=44,R=44,T=10,B=22;
 const scaleFor=pts=>{const ys=pts.map(p=>p[1]);let lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.15;if(!pad)pad=Math.abs(hi)*.05||1;lo-=pad;hi+=pad;return {lo,hi}};
 const sa=scaleFor(ptsA),sb=scaleFor(ptsB);
 const X=x=>L+x/(n-1)*(W-L-R);
 const YA=y=>T+(1-(y-sa.lo)/(sa.hi-sa.lo))*(H-T-B);
 const YB=y=>T+(1-(y-sb.lo)/(sb.hi-sb.lo))*(H-T-B);
 const decA=sa.hi-sa.lo<3?2:sa.hi-sa.lo<15?1:0,decB=sb.hi-sb.lo<3?2:sb.hi-sb.lo<15?1:0;
 let g='';
 for(let i=0;i<=4;i++){
  const ya=sa.lo+(sa.hi-sa.lo)*i/4,pya=YA(ya).toFixed(1);
  g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${pya}" y2="${pya}"/><text x="${L-6}" y="${+pya+4}" text-anchor="end">${fmt(ya,decA)}</text>`;
  const yb=sb.lo+(sb.hi-sb.lo)*i/4,pyb=YB(yb).toFixed(1);
  g+=`<text x="${W-R+6}" y="${+pyb+4}" text-anchor="start">${fmt(yb,decB)}</text>`;
 }
 for(let w=0;w*7<n;w+=2)g+=`<text x="${X(w*7).toFixed(1)}" y="${H-5}">W${w+1}</text>`;
 const drawSeries=(pts,Y,cls)=>{const sp=[...pts].sort((a,b)=>a[0]-b[0]);
  g+=`<path class="${cls}" d="M${sp.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')}"/>`;

 drawSeries(ptsA,YA,'s1');
 drawSeries(ptsB,YB,'s2');
 return `<figure class="chart">${cap}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${labelA} / ${labelB}">${g}</svg><p class="sub" style="color:var(--ink)"><span class="key" style="background:var(--ink)"></span>${labelA} (${unitA})</p><p class="sub" style="color:var(--s2)"><span class="key" style="background:var(--s2)"></span>${labelB} (${unitB})</p></figure>`;
}

function generateTalkingPoints(){
 const st=S.settings,start=st.start,end=addDays(start,N()-1),pts=[];
 const daysInRange=Object.entries(S.days).filter(([ds,d])=>{const i=diffDays(start,ds);return i>=0&&i<N()&&Object.keys(d).length});

 const avgWeek=(n,f)=>{const [a,b]=weekRange(n);return avg(a,b,f)};
 const findTrendStart=(weeklyVals,threshold)=>{
  if(weeklyVals.length<4)return null;
  const baseline=(weeklyVals[0][1]+weeklyVals[1][1])/2;
  for(let i=2;i<=weeklyVals.length-2;i++){
   const dir=Math.sign(weeklyVals[i][1]-baseline);
   if(dir===0)continue;
   let ok=true;
   for(let j=i;j<weeklyVals.length;j++){
    const diff=weeklyVals[j][1]-baseline;
    if(Math.sign(diff)!==dir||Math.abs(diff)<=threshold){ok=false;break}
   }
   if(ok){const seg=weeklyVals.slice(i);return {week:weeklyVals[i][0],baseline,current:seg.reduce((s,v)=>s+v[1],0)/seg.length,dir}}
  }
  return null;
 };
 const TREND=[
  ['Gewicht','kg',2,1,n=>avgWeek(n,'w')],
  ['Blutdruck systolisch','mmHg',5,0,n=>avgWeek(n,'sys')],
  ['Blutdruck diastolisch','mmHg',3,0,n=>avgWeek(n,'dia')],
  ['Ketone','mmol/l',0.3,2,n=>avgWeek(n,'k')],
  ['Ruhepuls','/min',3,0,n=>{const w=S.weeks[n];return w&&w.rhr!=null?w.rhr:null}]
 ];
 TREND.forEach(([label,unit,threshold,dec,get])=>{
  const weeklyVals=[];
  for(let n=1;n<=nWeeks();n++){const v=get(n);if(v!=null)weeklyVals.push([n,v])}
  const t=findTrendStart(weeklyVals,threshold);
  if(t)pts.push(`${label} seit Woche ${t.week} spürbar ${t.dir>0?'höher':'niedriger'} als in den ersten beiden Wochen (Ø ${fmt(t.baseline,dec)} vs. Ø ${fmt(t.current,dec)} ${unit}).`);
 });

 const over=[],under=[];
 daysInRange.forEach(([ds,d])=>{if(d.c!=null&&d.k!=null)(d.c>carbGoalOnDate(ds)?over:under).push(d.k)});
 if(over.length>=5&&under.length>=5){
  const avgOver=over.reduce((s,v)=>s+v,0)/over.length,avgUnder=under.reduce((s,v)=>s+v,0)/under.length;
  if(Math.abs(avgOver-avgUnder)>=0.3)pts.push(`An Tagen über dem Kohlenhydrat-Limit lagen die Ketonwerte im Schnitt bei Ø ${fmt(avgOver,2)} mmol/l, an Tagen im Limit bei Ø ${fmt(avgUnder,2)} mmol/l.`);
 }

 const half=N()/2;
 SYMS.forEach(s=>{
  const occ=daysInRange.filter(([,d])=>(d.sym||[]).includes(s));
  if(occ.length<3)return;
  const firstHalf=occ.filter(([ds])=>diffDays(start,ds)<half).length,secondHalf=occ.length-firstHalf;
  if(Math.abs(firstHalf-secondHalf)>=2)pts.push(`${s} in der ersten Hälfte an ${firstHalf} Tagen genannt, in der zweiten Hälfte an ${secondHalf} Tagen.`);
 });

 [...S.doseChanges].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(c=>{
  const med=st.meds.find(m=>m.id===c.medId);
  if(!doseChangeAppliesToMed(c,med))return;
  const beforeStart=addDays(c.date,-7),beforeEnd=addDays(c.date,-1),afterStart=addDays(c.date,1),afterEnd=addDays(c.date,7);
  if(countLogged(beforeStart,beforeEnd,'sys')<4||countLogged(afterStart,afterEnd,'sys')<4)return;
  const sysBefore=avg(beforeStart,beforeEnd,'sys'),sysAfter=avg(afterStart,afterEnd,'sys');
  const diaBefore=avg(beforeStart,beforeEnd,'dia'),diaAfter=avg(afterStart,afterEnd,'dia');
  const sysDiff=Math.abs(sysAfter-sysBefore),diaDiff=(diaBefore!=null&&diaAfter!=null)?Math.abs(diaAfter-diaBefore):0;
  if(sysDiff>=5||diaDiff>=3){
   pts.push(`Nach Anpassung von ${esc(med.name)} am ${fd(c.date)} (auf ${esc(c.newDose)}) lag der Blutdruck in den Folgetagen bei Ø ${fmt(sysAfter,0)} statt zuvor Ø ${fmt(sysBefore,0)} mmHg (sys).`);
  }
 });

 [['w','Gewicht'],['g','Blutzucker'],['k','Ketone'],['sys','Blutdruck']].forEach(([f,label])=>{
  const pct=countLogged(start,end,f)/N()*100;
  if(pct<70)pts.push(`${label} an nur ${fmt(pct,0)}% der Tage erfasst — die obigen Trends basieren entsprechend auf weniger Werten.`);
 });

 return pts;
}

function reportHTML(){

 const validDoseChanges=S.doseChanges.filter(c=>doseChangeAppliesToMed(c,st.meds.find(m=>m.id===c.medId)));
 const inR=Object.entries(S.days).filter(([ds,d])=>{const i=diffDays(st.start,ds);return i>=0&&i<N()&&Object.keys(d).length});
 const firstLast=f=>{let fi=null,la=null;for(let w=1;w<=nWeeks();w++){const [a,b]=weekRange(w);const v=avg(a,b,f);if(v!=null){if(!fi)fi=[w,v];la=[w,v]}}return [fi,la]};
 const wfl=f=>{const ws=Object.keys(S.weeks).map(Number).filter(n=>S.weeks[n][f]!=null).sort((a,b)=>a-b);return ws.length?[[ws[0],S.weeks[ws[0]][f]],[ws.at(-1),S.weeks[ws.at(-1)][f]]]:[null,null]};
 const weeklyPairsDay=f=>{const p=[];for(let w=1;w<=nWeeks();w++){const [a,b]=weekRange(w);const v=avg(a,b,f);if(v!=null)p.push([w,v])}return p};
 const weeklyPairsWeek=f=>Object.keys(S.weeks).map(Number).filter(n=>S.weeks[n][f]!=null).sort((a,b)=>a-b).map(n=>[n,S.weeks[n][f]]);
 const trendRow=(l,u,d,pairs)=>{
  const t=trendFit(pairs);
  if(!t)return `<tr><td>${l}</td><td>${u}</td><td class="num">–</td><td class="num">–</td><td class="num">zu wenige Wochen</td></tr>`;
  const xFirst=pairs[0][0],xLast=pairs.at(-1)[0];
  const yFirst=t.a+t.b*xFirst,yLast=t.a+t.b*xLast,dv=yLast-yFirst;

$('#v-set').addEventListener('change',e=>{
 const t=e.target,k=t.dataset.s;
 if(t.dataset.msMode!=null){
  const id=t.dataset.msMode,mode=t.value;
  if(!MEASUREMENT_IDS.includes(id)||!['daily','weekdays','optional'].includes(mode))return;
  const schedule=editableMeasurementSchedule(),prior=schedule[id];
  schedule[id]={mode,weekdays:mode==='weekdays'?(prior.mode==='weekdays'?[...prior.weekdays]:[isoWeekday(today())]):[]};
  save();renderSet();return;
 }
 if(t.id==='s_carb_date'||t.id==='al_date'){
  const date=settingsEffectiveDate(t.id);if(date)showDatedSettingsValues(t.id,date);
  return;
 }
 if(t.dataset.al){
  const date=settingsEffectiveDate('al_date');if(!date)return;
  const ak=t.dataset.al;
  const next={...alertsOnDate(date)};
  if(ak==='action')next.action=t.value.trim();
  else{
   const n=num(t.value);
   if(t.value.trim()!==''&&n===null){status('Bitte eine Zahl eingeben');return}
   next[ak]=n;
  }
  upsertAlertHistory(date,next);syncCurrentSettings();refreshDatedSettings();return;
 }
 if(k){
  if(k==='carbGoal'){
   const n=num(t.value);if(n==null||Math.round(n)<=0){status('Bitte eine positive Zahl eingeben');return}
   const date=settingsEffectiveDate('s_carb_date');if(!date)return;
   upsertCarbGoalHistory(date,Math.round(n));syncCurrentSettings();refreshDatedSettings();return;
  }
  if(k==='days'){const n=num(t.value);if(n==null||n<=0){status('Bitte eine Zahl eingeben');return}S.settings[k]=Math.round(n)}
  else if(k==='start'){if(!t.value)return;S.settings.start=t.value;$('#s_carb_date').min=t.value;$('#al_date').min=t.value}
  else S.settings[k]=t.value.trim();
  save();curWeek=Math.min(nWeeks(),Math.max(1,weekOf(today())));renderHead();return
 }
 if(t.dataset.mi!=null){const m=S.settings.meds[+t.dataset.mi];if(!m||m.stoppedAt||medHasHistory(m.id))return;m[t.dataset.mk]=t.value.trim();save()}
});
$('#v-set').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const id=b.id;
 if(b.dataset.msDay!=null){
  const measurement=b.dataset.msId,day=Number(b.dataset.msDay);
  if(!MEASUREMENT_IDS.includes(measurement)||!Number.isInteger(day)||day<1||day>7)return;
  const schedule=editableMeasurementSchedule(),entry=schedule[measurement];
  if(entry.mode!=='weekdays')return;
  const selected=new Set(entry.weekdays);
  if(selected.has(day)){
   if(selected.size===1){status('Mindestens einen Wochentag auswählen');return}
   selected.delete(day);
  }else selected.add(day);
  schedule[measurement]={mode:'weekdays',weekdays:[...selected].sort((a,b)=>a-b)};
  save();renderSet();return;
 }
 if(id==='exp'){doExportBackup();renderSet();renderHead()}
 if(id==='imp')$('#importFile').click();
 if(id==='csv'){const f=['w','g','k','sys','dia','p','c','en','hu','plan'];const hd=['Datum','Tag','Gewicht_kg','Blutzucker_mgdl','Ketone_mmolL','RR_sys','RR_dia','Puls','KH_g','Energie','Hunger','Im_Plan','Beschwerden','Notiz'];
  const rows=Object.keys(S.days).sort().map(ds=>{const d=S.days[ds];return [ds,diffDays(S.settings.start,ds)+1,...f.map(k=>d[k]==null?'':String(d[k]).replace('.',',')),(d.sym||[]).join(', '),(d.note||'').replace(/[\r\n;]+/g,' ')].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')});
  download(`keto-protokoll-${today()}.csv`,'\ufeff'+[hd.join(';'),...rows].join('\r\n'),'text/csv')}
 if(id==='restoreRecovery'){restoreRecovery();return}
 if(id==='deleteRecovery'){deleteRecovery();return}
 if(id==='reset'&&confirm('Wirklich alle Daten löschen? Das lässt sich nicht rückgängig machen.')){
  try{localStorage.removeItem(KEY);localStorage.removeItem(RECOVERY_KEY)}
  catch(e){status('Löschen fehlgeschlagen');return}
  load();curDate=today();renderAll();status('Gelöscht');return;
 }
 if(id==='medAdd'){S.settings.meds.push({id:uid(),name:'',dose:'',category:'Medikament',startedAt:today(),stoppedAt:null});save();renderSet();const ins=document.querySelectorAll('#v-set input[data-mk="name"]');ins[ins.length-1].focus()}
 else if(b.dataset.mdel!=null){
  const m=S.settings.meds[+b.dataset.mdel];
  if(!m||m.stoppedAt)return;
  if(medHasHistory(m.id)){
   const input=prompt('Ab welchem Datum wird dieses Medikament nicht mehr eingenommen? (JJJJ-MM-TT)',today());
   if(input===null)return;
   const date=input.trim();
   if(!validISODate(date)){status('Bitte ein gültiges Datum (JJJJ-MM-TT) eingeben');return}
   if(m.startedAt&&date<=m.startedAt){status('Stoppdatum muss nach dem Beginn liegen');return}
   const laterLog=Object.entries(S.days).some(([ds,d])=>ds>=date&&d&&d.meds&&Object.prototype.hasOwnProperty.call(d.meds,m.id));
   const laterChange=S.doseChanges.some(c=>c.medId===m.id&&c.date>=date);
   if((laterLog||laterChange)&&!confirm('Ab diesem Datum vorhandene Einnahme- und Dosisänderungseinträge bleiben gespeichert, werden aber in den betreffenden Ansichten und Einnahmeberechnungen nicht mehr berücksichtigt. Trotzdem beenden?'))return;
   m.stoppedAt=date;save('Beendet');renderSet();return;
  }
  if((m.name||m.dose)&&!confirm(`"${m.name||'Medikament'}" entfernen?`))return;
  S.settings.meds.splice(+b.dataset.mdel,1);save('Entfernt');renderSet();
 }
 else if(b.dataset.mdose!=null){
  const m=S.settings.meds[+b.dataset.mdose];
  if(!m||m.stoppedAt)return;
  const nv=prompt(`Neue Dosis für ${m.name||'dieses Medikament'}:`,m.dose||'');
  if(nv==null||!nv.trim())return;
  const input=prompt('Datum der Änderung (JJJJ-MM-TT):',today());
  if(input===null)return;
  const date=input.trim();
  if(!validISODate(date)||m.startedAt&&date<m.startedAt||m.stoppedAt&&date>=m.stoppedAt){status('Bitte ein gültiges Datum innerhalb des Einnahmezeitraums eingeben');return}
  S.doseChanges.push({date,medId:m.id,oldDose:m.dose,newDose:nv.trim()});m.dose=nv.trim();save('Dosis aktualisiert');renderSet();
 }
 else if(b.dataset.extend!=null){S.settings.days=(Number(S.settings.days)||0)+Number(b.dataset.extend);save();renderSet();renderHead()}
 else if(id==='newRound'){
  const end=addDays(S.settings.start,N()-1);
  if(!confirm(`Der aktuelle Zeitraum (${fd(S.settings.start,{day:'numeric',month:'long',year:'numeric'})} bis ${fd(end,{day:'numeric',month:'long',year:'numeric'})}) wird archiviert und bleibt über 'Frühere Durchgänge' einsehbar. Ein neuer Durchgang beginnt heute. Fortfahren?`))return;
  startNewRound();
 }
 else if(b.dataset.arview!=null)viewArchivedReport(+b.dataset.arview);
 else if(b.dataset.ardel!=null){const a=S.archive[+b.dataset.ardel];if(!confirm(`"${a.label}" endgültig löschen?`))return;S.archive.splice(+b.dataset.ardel,1);save('Entfernt');renderSet()}
});
function startNewRound(){
 const t=today(),end=addDays(S.settings.start,N()-1);
 S.archive.push({archivedAt:t,label:`${S.settings.start} – ${end}`,data:JSON.parse(JSON.stringify({settings:S.settings,days:S.days,weeks:S.weeks,labs:S.labs,labDates:S.labDates,doseChanges:S.doseChanges}))});
 const goal=carbGoalOnDate(t),alerts={...alertsOnDate(t)};
 S.settings.meds=S.settings.meds.filter(m=>medAppliesOnDate(m,t));
 S.settings.start=t;
 S.settings.carbGoal=goal;
 S.settings.alerts=alerts;
 S.settings.carbGoalHistory=[{date:t,value:goal}];
 S.settings.alertHistory=[{date:t,value:{...alerts}}];
 S.days={};
 S.weeks={};
 S.doseChanges=[];
 S.labs=S.labs.map(r=>({name:r.name,unit:r.unit,range:r.range,base:'',end:''}));
 S.labDates={base:t,end:''};
 S.settings.questions='';
 save();
 curDate=t;
 renderAll();
 status('Neuer Durchgang gestartet');
}
function viewArchivedReport(idx){
 const entry=S.archive[idx];if(!entry)return;
 const live=S;
 let html;
 try{
  S=entry.data;
  html=reportHTML();
 }finally{S=live}
 doPrint(html,false);
}
const plainObject=value=>value!==null&&typeof value==='object'&&!Array.isArray(value)&&Object.getPrototypeOf(value)===Object.prototype;
const optionalDate=value=>value==null||value===''||validISODate(value);
const validMedication=med=>plainObject(med)&&
 (med.startedAt===null||validISODate(med.startedAt))&&
 (med.stoppedAt===null||validISODate(med.stoppedAt))&&
 (med.startedAt===null||med.stoppedAt===null||med.stoppedAt>med.startedAt);
function validateBackupShape(data){
 if(!plainObject(data)||!plainObject(data.settings)||!plainObject(data.days))return false;
 if('dataVersion' in data&&(!Number.isInteger(data.dataVersion)||data.dataVersion<0))return false;
 for(const key of ['weeks','labDates','refRead'])if(key in data&&!plainObject(data[key]))return false;
 for(const key of ['labs','doseChanges','archive'])if(key in data&&!Array.isArray(data[key]))return false;
 for(const key of ['alerts'])if(key in data.settings&&!plainObject(data.settings[key]))return false;
 if('measurementSchedule' in data.settings&&!plainObject(data.settings.measurementSchedule))return false;
 for(const key of ['meds','carbGoalHistory','alertHistory'])if(key in data.settings&&!Array.isArray(data.settings[key]))return false;
 return true;
}
function validatePreparedBackup(data){
 return validateBackupShape(data)&&validISODate(data.settings.start)&&
  validMeasurementSchedule(data.settings.measurementSchedule)&&
  optionalDate(data.settings.lastBackup)&&
  ['weeks','labDates','refRead'].every(key=>plainObject(data[key]))&&
  ['labs','doseChanges','archive'].every(key=>Array.isArray(data[key]))&&
  ['meds','carbGoalHistory','alertHistory'].every(key=>Array.isArray(data.settings[key]))&&
  ['base','end'].every(key=>optionalDate(data.labDates[key]))&&
  Object.values(data.days).every(day=>plainObject(day)&&(day.sym==null||Array.isArray(day.sym)))&&
  Object.values(data.weeks).every(plainObject)&&
  data.labs.every(plainObject)&&data.doseChanges.every(plainObject)&&
  data.archive.every(entry=>plainObject(entry)&&validISODate(entry.archivedAt))&&
  data.settings.meds.every(validMedication);
}
function prepareBackup(data){
 if(!validateBackupShape(data))return {error:'shape'};
 if((data.dataVersion||0)>DATA_VERSION)return {error:'future'};
 try{
  const prepared=migrate(JSON.parse(JSON.stringify(data)));
  return validatePreparedBackup(prepared)?{prepared}:{error:'shape'};
 }catch(e){return {error:'migration'}}
}
function readRecovery(){
 try{
  const raw=localStorage.getItem(RECOVERY_KEY);
  if(!raw)return null;
  const wrapper=JSON.parse(raw);
  if(!plainObject(wrapper)||typeof wrapper.createdAt!=='string'||!Number.isFinite(Date.parse(wrapper.createdAt)))return null;
  const result=prepareBackup(wrapper.data);
  return result.prepared?{createdAt:wrapper.createdAt,prepared:result.prepared}:null;
 }catch(e){return null}
}
function createRecovery(){
 try{localStorage.setItem(RECOVERY_KEY,JSON.stringify({createdAt:new Date().toISOString(),data:S}));return true}
 catch(e){return false}
}
function replaceLiveState(prepared,failureMessage){
 const live=S;
 try{
  S=prepared;
  syncCurrentSettings();
  if(persistState())return true;
 }catch(e){}
 S=live;
 status(failureMessage);
 return false;
}
function restoreRecovery(){
 const recovery=readRecovery();
 if(!recovery){status('Keine gültige Sicherheitskopie gefunden');renderSet();return}
 if(!confirm('Vorherige Daten wiederherstellen? Die aktuellen Browserdaten werden ersetzt.'))return;
 if(!replaceLiveState(recovery.prepared,'Wiederherstellen fehlgeschlagen – aktuelle Daten bleiben erhalten'))return;
 let removed=true;
 try{localStorage.removeItem(RECOVERY_KEY)}catch(e){removed=false}
 renderAll();
 status(removed?'Vorherige Daten wiederhergestellt':'Daten wiederhergestellt – Sicherheitskopie konnte nicht gelöscht werden');
}
function deleteRecovery(){
 if(!confirm('Lokale Sicherheitskopie löschen? Die aktuellen Daten bleiben erhalten.'))return;
 try{localStorage.removeItem(RECOVERY_KEY);renderSet();status('Sicherheitskopie gelöscht')}
 catch(e){status('Sicherheitskopie konnte nicht gelöscht werden')}
}
function importSummary(data,version){
 const name=typeof data.settings.name==='string'&&data.settings.name.trim()?data.settings.name.trim():'ohne Name';
 const start=validISODate(data.settings.start)?data.settings.start:'nicht angegeben';
 const logged=Object.values(data.days).filter(day=>plainObject(day)&&Object.keys(day).length).length;
 const archived=Array.isArray(data.archive)?data.archive.length:0;
 return `Backup laden?\nName: ${name}\nStart: ${start}\nErfasste Tage: ${logged}\nArchivierte Durchgänge: ${archived}\nDatenversion: ${version}\n\nDie aktuellen Browserdaten werden ersetzt. Zuvor wird eine lokale Sicherheitskopie erstellt.`;
}
$('#importFile').addEventListener('change',e=>{
 const input=e.target,file=input.files[0];
 if(!file){input.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{try{
  let data;
  try{data=JSON.parse(reader.result)}catch(err){status('Datei ist kein gültiges JSON-Backup');return}
  const result=prepareBackup(data);
  if(result.error==='future'){status('Backup stammt aus einer neueren App-Version — bitte zuerst die App aktualisieren.');return}
  if(result.error==='migration'){status('Backup konnte nicht verarbeitet werden');return}
  if(result.error){status('Backup hat ein ungültiges Datenformat');return}
  const version=data.dataVersion??'nicht angegeben';
  if(!confirm(importSummary(result.prepared,version)))return;
  if(!createRecovery()){status('Sicherheitskopie konnte nicht erstellt werden – Backup nicht geladen');return}
  if(!replaceLiveState(result.prepared,'Backup konnte nicht gespeichert werden – aktuelle Daten bleiben erhalten'))return;
  renderAll();status('Backup geladen');
 }finally{input.value=''}};
 reader.onerror=()=>{status('Backup-Datei konnte nicht gelesen werden');input.value=''};
 reader.onabort=()=>{status('Backup-Laden abgebrochen');input.value=''};
 try{reader.readAsText(file)}catch(err){status('Backup-Datei konnte nicht gelesen werden');input.value=''}
});

/* ---------- literature ---------- */
function renderLit(){
 const read=REFERENCES.filter(r=>S.refRead[r.id]).length;
 const groups=[];
 REFERENCES.forEach(r=>{
  let g=groups.find(x=>x.category===r.category);
  if(!g){g={category:r.category,items:[]};groups.push(g)}
  g.items.push(r);
 });
 const item=r=>{
  const checked=!!S.refRead[r.id];
  const link=r.doi?`https://doi.org/${r.doi}`:(r.url||null);
  return `<div class="row wide lit-item"><label><input type="checkbox" data-ref="${r.id}" ${checked?'checked':''}><b>${esc(r.title)}</b></label><p class="small">${esc(r.citation)}</p><span class="badge">${esc(r.access)}</span><p class="lit-note">${esc(r.note)}</p>${link?`<a href="${esc(link)}" target="_blank" rel="noopener">Quelle öffnen</a>`:''}</div>`;
 };
 $('#v-lit').innerHTML=`<div class="panel"><h2>Literatur</h2><p class="sub">${read} von ${REFERENCES.length} gelesen</p></div>
 ${groups.map(g=>`<div class="panel"><h2>${esc(g.category)}</h2>${g.items.map(item).join('')}</div>`).join('')}`;
}
$('#v-lit').addEventListener('change',e=>{
 if(e.target.dataset.ref==null)return;
 const id=e.target.dataset.ref;
 if(e.target.checked)S.refRead[id]=true;else delete S.refRead[id];
 save();
 const y=window.scrollY;renderLit();window.scrollTo(0,y);
});

/* ---------- tabs ---------- */
const R={day:renderDay,week:renderWeek,lab:renderLab,trend:renderTrend,print:renderPrint,set:renderSet,lit:renderLit};
function show(tab){curTab=tab;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));Object.keys(R).forEach(k=>$('#v-'+k).hidden=k!==tab);R[tab]();renderHead()}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
$('#strip').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(!b)return;curDate=b.dataset.date;show('day')});
$('#nudge').addEventListener('click',e=>{if(e.target.dataset.goto)show(e.target.dataset.goto)});
function renderAll(){curWeek=Math.min(nWeeks(),Math.max(1,weekOf(today())));show(curTab)}

const pendingEdits=new WeakSet();
const autosaveField=el=>el&&(el instanceof HTMLInputElement||el instanceof HTMLTextAreaElement)&&el.isConnected&&!el.disabled&&!el.readOnly&&el.type!=='file'&&el.closest('#v-day,#v-week,#v-lab,#v-print,#v-set');
document.addEventListener('input',e=>{if(autosaveField(e.target))pendingEdits.add(e.target)});
document.addEventListener('change',e=>pendingEdits.delete(e.target));
function flushPendingEdit(){
 // Preserve a newer external write, such as one made by another tab.
 try{if(localStorage.getItem(KEY)!==lastPersistedRaw)return false}catch(e){return false}
 const active=document.activeElement;
 if(autosaveField(active)&&pendingEdits.has(active)){
  pendingEdits.delete(active);
  active.dispatchEvent(new Event('change',{bubbles:true}));
 }
 return persistState();
}
window.addEventListener('pagehide',flushPendingEdit);
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden')flushPendingEdit();
});

$('#verline').textContent='v'+VERSION;
load();renderAll();

/* Asks the browser to exempt this origin's storage from eviction under
   pressure. true/false/'unsupported' — 'unsupported' also covers any
   unexpected failure, since the outcome is informational only and must
   never block startup. */
let storageStatus=null;
function storageStatusLine(){
 if(storageStatus===true)return 'Speicher: dauerhaft geschützt';
 if(storageStatus===false)return 'Speicher: nicht dauerhaft geschützt — regelmäßige Backups besonders wichtig';
 if(storageStatus==='unsupported')return 'Speicher-Schutz vom Browser nicht unterstützt';
 return '';
}
async function checkStorage(){
 try{
  if(navigator.storage&&navigator.storage.persist){
   let p=await navigator.storage.persisted();
   if(!p)p=await navigator.storage.persist();
   storageStatus=p;
  }else{
   storageStatus='unsupported';
  }
 }catch(e){storageStatus='unsupported'}
 if(curTab==='set')renderSet();
}
checkStorage();

/* Registers sw.js for offline support. Only takes effect over HTTPS (e.g. GitHub
   Pages) — 'serviceWorker' is undefined under file://, so this silently no-ops
   there. Keep index.html VERSION, package.json version, package-lock.json version
   metadata, and sw.js CACHE_NAME synchronized so each release replaces the cache. */
if('serviceWorker' in navigator){
 try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
